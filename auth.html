<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área Reservada · Scouting 360 YTB</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080C08;--bg2:#0F1410;--gold:#D4AF37;--gold-soft:rgba(212,175,55,.15);--gold-border:rgba(212,175,55,.3);
  --green:#00D46A;--red:#FF4A4A;--orange:#FFA500;--blue:#4A9FE8;
  --border:#1F2520;--white:#fff;--slate:#bbb;--muted:#666;
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;-webkit-font-smoothing:antialiased}

.box{max-width:440px;width:100%;background:var(--bg2);border:2px solid var(--border);padding:30px 26px}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:24px;text-decoration:none}
.logo-b{width:36px;height:36px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:900;font-size:14px;color:#000}
.logo-n{font-family:'Barlow Condensed';font-weight:800;font-size:20px;letter-spacing:1.5px}
.logo-n span{color:var(--gold)}

.head{text-align:center;margin-bottom:24px}
.eyebrow{font-size:9px;font-weight:800;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:6px}
.title{font-family:'Barlow Condensed';font-weight:900;font-size:26px;line-height:1;letter-spacing:-.5px}
.title span{color:var(--gold)}

.role-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:20px}
.role-tab{padding:11px 6px;background:var(--bg);border:1px solid var(--border);color:#aaa;font-family:'Barlow Condensed';font-weight:900;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;text-align:center;transition:all .15s;line-height:1.1}
.role-tab:hover{border-color:var(--gold-border);color:#fff}
.role-tab.active{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.role-tab small{display:block;font-size:8px;letter-spacing:.5px;margin-top:3px;font-weight:600;opacity:.7}

.field{margin-bottom:14px}
.field-label{font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--slate);text-transform:uppercase;margin-bottom:4px;display:block}
.field-input{width:100%;background:var(--bg);border:1px solid var(--border);color:#fff;padding:12px 14px;font-size:14px;font-family:inherit;outline:none}
.field-input:focus{border-color:var(--gold)}

.btn{width:100%;padding:13px;background:var(--gold);color:#000;border:none;font-family:'Barlow Condensed';font-weight:900;font-size:13px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-top:6px}
.btn:hover{background:#F5C842}
.btn:disabled{background:var(--bg);color:var(--muted);cursor:not-allowed}

.error{background:rgba(255,74,74,.08);border:1px solid rgba(255,74,74,.3);color:#ffaaaa;padding:10px;font-size:12px;margin-top:10px;text-align:center;display:none}
.error.show{display:block}

.info{margin-top:18px;padding-top:18px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);line-height:1.5;text-align:center}
.info a{color:var(--gold);text-decoration:none}
.info a:hover{text-decoration:underline}

.foot{margin-top:18px;font-size:10px;color:var(--muted);text-align:center}
.foot a{color:var(--slate)}
</style>
<link rel="stylesheet" href="/assets/css/ytb-vivo.css">
<script src="/assets/js/ytb-vivo.js"></script>
</head>
<body>

<div class="box">

  <a href="/" class="logo">
    <div class="logo-b">YT</div>
    <div class="logo-n">Your<span>Talent</span>Base</div>
  </a>

  <div class="head">
    <div class="eyebrow">🔐 Área Reservada</div>
    <h1 class="title">Login <span>YourTalentBase</span></h1>
  </div>

  <div class="field">
    <label class="field-label">Email</label>
    <input class="field-input" id="email" type="email" placeholder="o-teu@email.com" autocomplete="email">
  </div>

  <div class="field">
    <label class="field-label">Password</label>
    <input class="field-input" id="pwd" type="password" placeholder="Insere a password" autocomplete="current-password">
  </div>

  <button class="btn" id="btn-login" onclick="doLogin()">Entrar →</button>

  <button class="btn" id="btn-magic" onclick="doMagic()" style="margin-top:8px;background:transparent;border:1px solid var(--gold);color:var(--gold)">Entrar por link no email ✉</button>

  <div class="error" id="error">Credenciais incorrectas</div>

  <div class="info" id="info">
    Não tens credenciais? <a href="https://wa.me/351913695846?text=Ol%C3%A1%2C%20sou%20clube%20e%20gostaria%20de%20subscrever%20o%20Scouting%20360" target="_blank">Pedir acesso B2B →</a>
  </div>

  <div class="foot">
    <a href="/">← Voltar à home</a> · <a href="termos.html">Termos</a> · <a href="privacidade.html">Privacidade</a>
  </div>

</div>

<script>
const SUPABASE_URL = 'https://nhshnplaiolxwcfuijfo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oc2hucGxhaW9seHdjZnVpamZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4NDQxNTAsImV4cCI6MjA4OTQyMDE1MH0.uyZiDun8495sjnHA6Wsk-Hou-3lubbNJfQqSYbMLSek';
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storageKey:'ytb-auth', flowType:'pkce' }
});

function mostrarErro(msg){
  const err = document.getElementById('error');
  err.textContent = msg;
  err.classList.add('show');
}

function encaminhar(papel){
  if(papel === 'admin'){
    window.location.href = 'admin360.html';
  } else if(papel === 'scout'){
    window.location.href = 'scouts.html';
  } else if(papel === 'cliente'){
    window.location.href = 'scouting360-dashboard.html';
  } else if(papel === 'familia'){
    window.location.href = 'acesso.html';
  } else if(papel === 'treinador'){
    window.location.href = 'ytb-pro-treinador.html';
  } else if(papel === 'clube'){
    window.location.href = 'ytb-pro-treinador.html';
  } else {
    // papel desconhecido - sem area propria ainda
    mostrarErro('A tua conta ainda nao tem area atribuida. Contacta-nos por WhatsApp.');
  }
}

const DESTINOS = { 'acesso.html':['familia','admin'], 'ytb-pro-treinador.html':['treinador','clube','admin'], 'scouts.html':['scout','admin'], 'scouting360-dashboard.html':['cliente','admin'], 'admin360.html':['admin'] };
function destinoPedido(){
  const d = new URLSearchParams(location.search).get('dest');
  return (d && DESTINOS[d]) ? d : null;
}
function irPara(papel){
  const d = destinoPedido();
  if(d && DESTINOS[d].includes(papel)){ window.location.href = d; return; }
  encaminhar(papel);
}

async function doMagic(){
  const email = document.getElementById('email').value.trim().toLowerCase();
  if(!email || !email.includes('@')){ mostrarErro('Insere um email valido'); return; }
  const btn = document.getElementById('btn-magic');
  btn.disabled = true; btn.textContent = 'A enviar...';
  const dest = destinoPedido();
  const redirect = window.location.origin + '/auth.html' + (dest ? '?dest=' + dest : '');
  const { error } = await supa.auth.signInWithOtp({ email: email, options: { emailRedirectTo: redirect } });
  if(error){ mostrarErro('Nao foi possivel enviar o link. Tenta novamente.'); btn.disabled = false; btn.textContent = 'Entrar por link no email ✉'; return; }
  btn.textContent = 'Link enviado ✓ Ve o teu email';
  document.getElementById('info').innerHTML = 'Abre o link no email para entrares. Podes fechar esta pagina.';
}

async function doLogin(){
  const email = document.getElementById('email').value.trim().toLowerCase();
  const pwd = document.getElementById('pwd').value;
  const btn = document.getElementById('btn-login');
  document.getElementById('error').classList.remove('show');

  if(!email || !email.includes('@')){ mostrarErro('Insere um email valido'); return; }
  if(!pwd){ mostrarErro('Insere a password'); return; }

  btn.disabled = true;
  btn.textContent = 'A entrar...';

  try {
    // 1. Login Supabase Auth
    const { data: authData, error: authErr } = await supa.auth.signInWithPassword({
      email: email,
      password: pwd
    });

    if(authErr || !authData.session){
      mostrarErro('Email ou password incorrectos');
      btn.disabled = false; btn.textContent = 'Entrar →';
      return;
    }

    // 2. Buscar papel na tabela perfis
    const { data: perfil, error: perfilErr } = await supa
      .from('perfis')
      .select('papel, estado')
      .eq('id', authData.session.user.id)
      .maybeSingle();

    if(perfilErr || !perfil){
      mostrarErro('Perfil nao encontrado. Contacta o administrador.');
      await supa.auth.signOut();
      btn.disabled = false; btn.textContent = 'Entrar →';
      return;
    }

    // 3. Verificar estado
    if(perfil.estado === 'bloqueado'){
      mostrarErro('Conta bloqueada. Contacta o administrador.');
      await supa.auth.signOut();
      btn.disabled = false; btn.textContent = 'Entrar →';
      return;
    }

    if(perfil.estado === 'pendente'){
      mostrarErro('A tua conta aguarda aprovacao. Avisamos quando estiver activa.');
      await supa.auth.signOut();
      btn.disabled = false; btn.textContent = 'Entrar →';
      return;
    }

    // 4. Aprovado - encaminhar conforme papel (ou destino pedido em ?dest=)
    irPara(perfil.papel);

  } catch(e){
    console.error(e);
    mostrarErro('Erro ao entrar. Tenta novamente.');
    btn.disabled = false; btn.textContent = 'Entrar →';
  }
}

document.getElementById('pwd').addEventListener('keydown', e => {
  if(e.key === 'Enter') doLogin();
});
document.getElementById('email').addEventListener('keydown', e => {
  if(e.key === 'Enter') document.getElementById('pwd').focus();
});

// Se ja ha sessao activa, encaminhar
(async () => {
  const { data: { session } } = await supa.auth.getSession();
  if(session){
    const { data: perfil } = await supa
      .from('perfis')
      .select('papel, estado')
      .eq('id', session.user.id)
      .maybeSingle();
    if(perfil && perfil.estado === 'aprovado'){
      irPara(perfil.papel);
    }
  }
  document.getElementById('email').focus();
})();
</script>

</body>
</html>
