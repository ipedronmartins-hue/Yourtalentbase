<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="stylesheet" href="ytb.css">
<style>
  :root{/* tokens próprios desta página */ --obs-bar:#3FA76E; --dec-bar2:#465147;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.5;
    padding-bottom:60px;
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .wrap{max-width:468px;margin:0 auto;padding:0 16px}

  /* ── topo ── */
  .top{
    position:sticky;top:0;z-index:20;background:#080C08F2;backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  .top .wrap{display:flex;align-items:center;gap:10px;height:54px}
  .mono{
    font-family:'Barlow Condensed',sans-serif;font-weight:900;letter-spacing:.06em;
    font-size:var(--fs-sub);color:var(--gold); text-decoration:none;
  }
  .top .who{flex:1;font-size:var(--fs-corpo);color:var(--slate);font-weight:600;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top button{
    background:transparent;border:1px solid var(--border);color:var(--slate);
    border-radius:9px;padding:8px 12px;font-family:inherit;font-size:var(--fs-corpo);font-weight:600;
    cursor:pointer;transition:.15s;
  }
  .top button:hover{color:var(--text);border-color:#2C342C}

  .eyebrow{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.2em;font-size:var(--fs-legenda);color:var(--muted)}
  .shead{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:var(--fs-sub);color:var(--text);margin:34px 2px 12px;display:flex;align-items:center;gap:9px}
  .shead::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}

  /* ── cartão identidade + curva ── */
  .pcard{background:linear-gradient(180deg,var(--bg2),#0C110C);border:1px solid var(--border);border-radius:18px;padding:18px;margin-top:16px;overflow:hidden}
  .head{display:flex;align-items:center;gap:13px}
  .photo{width:62px;height:62px;border-radius:14px;flex:0 0 auto;background:
      radial-gradient(circle at 50% 35%, #28332A 0%, #131A14 70%);
      border:1px solid var(--border);position:relative;overflow:hidden}
  .photo::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);width:38px;height:38px;border-radius:50% 50% 45% 45%;background:#3A463C}
  .photo .pp{position:absolute;inset:0;background-size:cover;background-position:center;border-radius:14px}
  .idblock{flex:1;min-width:0}
  .idblock .name{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:var(--fs-titulo);line-height:1;letter-spacing:.01em}
  .idblock .meta{font-size:var(--fs-corpo);color:var(--slate);margin-top:4px}
  .idblock .meta .pos{display:inline-block;background:var(--bg4);border:1px solid var(--border);color:var(--text);font-weight:700;font-size:var(--fs-legenda);border-radius:6px;padding:2px 8px;margin-right:7px}
  /* selo — assinatura, ouro */
  .selo{flex:0 0 auto;text-align:center;color:var(--gold);border:1.4px dashed #D4AF3766;border-radius:12px;padding:7px 9px;transform:rotate(2deg)}
  .selo .v{display:block;font-size:var(--fs-sub);line-height:1}
  .selo .src{font-size:var(--fs-micro);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:2px;color:#D4AF37CC}

  .curvebox{position:relative;margin-top:16px;border-top:1px solid var(--border);padding-top:14px}
  .curvebox .cap{position:absolute;top:18px;left:2px;z-index:2}
  .curvebox .cap .big{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:var(--fs-titulo);line-height:.9;color:var(--up)}
  .curvebox .cap .lbl{font-size:var(--fs-legenda);text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin-top:3px}
  svg.curve{display:block;width:100%;height:150px}

  /* ── contexto competitivo ── */
  .ctx{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-top:14px}
  .ctx>div{background:var(--bg2);padding:11px 6px;text-align:center}
  .ctx .v{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:var(--fs-sub);color:var(--text)}
  .ctx .l{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-top:3px;line-height:1.3}

  /* ── 4 indicadores primários ── */
  .prim{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .evosemanal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 8px;margin-top:10px}
  .evosemanal-tit{font-family:var(--fd);font-weight:800;font-size:14px;margin-bottom:10px;padding:0 6px}
  .evosemanal-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;text-align:center}
  .evosemanal-item{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
  .evosemanal-ico{font-size:15px}
  .evosemanal-l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
  .evosemanal-v{font-family:var(--fd);font-weight:800;font-size:15px}
  .evosemanal-legenda{font-size:var(--fs-legenda);color:var(--muted);margin-top:10px;text-align:center;padding:0 6px}
  .tile{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center}
  .tile .l{font-size:var(--fs-legenda);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:7px;line-height:1.3;min-height:23px;display:flex;align-items:center;justify-content:center}
  .tile .v{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:var(--fs-titulo);line-height:1}
  .tile .v small{font-size:var(--fs-corpo);font-weight:700}
  .v.obs{color:var(--obs)} .v.dec{color:var(--dec)} .v.up{color:var(--up)}
  .v-vazio{color:var(--muted);opacity:.6;font-size:.85em}
  .ver-mais{margin-top:10px}
  .ver-mais summary{cursor:pointer;font-size:var(--fs-legenda);color:var(--slate);font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:8px 0;list-style:none}
  .ver-mais summary::-webkit-details-marker{display:none}
  .ver-mais summary::before{content:'▸ ';color:var(--gold)}
  .ver-mais[open] summary::before{content:'▾ '}
  .vazio-explicado{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:10px}
  .vazio-explicado b{display:block;font-size:14px;margin-bottom:4px;color:var(--text)}
  .vazio-explicado p{margin:0;font-size:var(--fs-corpo);color:var(--slate);line-height:1.5}

  /* densidade + legenda */
  .dens{display:flex;flex-wrap:wrap;align-items:center;gap:7px 14px;margin-top:12px;padding:11px 13px;background:var(--bg2);border:1px solid var(--border);border-radius:12px}
  .dens .lab{font-size:var(--fs-legenda);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;width:100%}
  .dens i{font-style:normal;font-size:var(--fs-corpo);color:var(--slate)}
  .dens i b{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:var(--fs-sub);color:var(--text);margin-right:5px}
  .legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:11px 2px 0}
  .legend i{font-style:normal;display:flex;align-items:center;gap:6px;font-size:var(--fs-legenda);color:var(--slate)}
  .legend .dot{width:8px;height:8px;border-radius:50%}

  /* ── DNA ── */
  .panel{background:linear-gradient(180deg,var(--bg2),#0C110C);border:1px solid var(--border);border-radius:16px;padding:18px}
  .panel .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .panel .hd h3{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:var(--fs-sub);text-transform:uppercase;letter-spacing:.02em}
  .badge{font-size:var(--fs-legenda);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);border:1px solid #D4AF3744;border-radius:20px;padding:3px 9px;white-space:nowrap}
  .panel .sub{font-size:var(--fs-corpo);color:var(--muted);margin-top:5px;line-height:1.5}
  .dna-grid{margin-top:14px;display:flex;flex-direction:column;gap:11px}
  .trait .tl{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--fs-corpo);margin-bottom:5px}
  .trait .tl span{color:var(--slate)}
  .trait .tl b{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:var(--fs-sub)}
  .trait .tl b.obs{color:var(--obs)} .trait .tl b.dec{color:var(--dec)}
  .barx{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden}
  .barx i{display:block;height:100%;border-radius:3px}
  .panel .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
  .panel .stats .v{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:var(--fs-sub)}
  .panel .stats .l{font-size:var(--fs-legenda);color:var(--muted);margin-top:2px}

  /* atividade */
  .act{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .act .cell{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 6px;text-align:center}
  .act .cell .v{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:var(--fs-titulo)}
  .act .cell .l{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:4px;line-height:1.3}

  /* marcos — ouro, orgulho */
  .marcos{display:flex;flex-direction:column;gap:8px}
  .marco{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#16130A 0%,var(--bg2) 60%);border:1px solid #2A2414;border-radius:13px;padding:13px 14px}
  .marco .ic{color:var(--gold);font-size:var(--fs-sub);flex:0 0 auto}
  .marco .tt{flex:1;font-size:var(--fs-corpo);font-weight:600;color:var(--text)}
  .marco .wn{font-size:var(--fs-legenda);color:var(--muted);white-space:nowrap}

  /* carreira */
  .car{display:flex;flex-direction:column}
  .car .item{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--border)}
  .car .item:last-child{border-bottom:0}
  .car .yr{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:var(--fs-sub);color:var(--slate);width:48px;flex:0 0 auto}
  .car .cl{font-size:var(--fs-corpo);font-weight:600}
  .car .cl small{display:block;color:var(--muted);font-weight:400;font-size:var(--fs-legenda);margin-top:2px}

  /* morfologia (privado) */
  .morfo{border:1px dashed #2C342C;background:#0C110C}
  .morfo .lock{font-size:var(--fs-legenda);color:var(--gold);letter-spacing:.02em}
  .morfo .fields{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
  .morfo .f{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 6px;text-align:center}
  .morfo .f .l{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .morfo .f .v{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:var(--fs-sub);color:#3A463C;margin-top:3px}
  .morfo .derived{font-size:var(--fs-legenda);color:var(--muted);margin-top:12px;line-height:1.55}

  /* timeline */
  .tl-list{display:flex;flex-direction:column}
  .tl-row{display:flex;align-items:flex-start;gap:11px;padding:13px 0;border-bottom:1px solid var(--border)}
  .tl-row:last-child{border-bottom:0}
  .tl-row .mk{font-size:var(--fs-corpo);line-height:1.4;flex:0 0 auto;width:14px;text-align:center}
  .tl-row .ev{flex:1;min-width:0}
  .tl-row .ev .t{font-size:var(--fs-corpo);font-weight:600;line-height:1.4}
  .tl-row .ev .s{font-size:var(--fs-legenda);color:var(--muted);margin-top:3px;line-height:1.4}
  .tl-row .pill{font-size:var(--fs-micro);font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:5px;padding:3px 7px;white-space:nowrap;align-self:center}
  .pill.obs{background:#3FA76E22;color:var(--obs-bar);border:1px solid #3FA76E33}
  .pill.dec{background:#46514733;color:var(--dec);border:1px solid #46514744}
  .pill.mar{background:#D4AF3722;color:var(--gold);border:1px solid #D4AF3744}
  .tl-row .when{font-size:var(--fs-legenda);color:var(--muted);white-space:nowrap;align-self:center}
  .up{color:var(--up)} .down{color:var(--down)}

  .share{width:100%;margin-top:22px;border:none;border-radius:13px;cursor:pointer;padding:15px;background:var(--text);color:#0A0D0A;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:var(--fs-sub);text-transform:uppercase;letter-spacing:.07em;transition:.15s}
  .share:hover{filter:brightness(1.06)} .share:active{transform:scale(.99)}
  .foot{text-align:center;font-size:var(--fs-legenda);color:var(--muted);margin-top:18px;letter-spacing:.04em}
  .demo-tag{display:inline-block;color:var(--gold);font-weight:700}

  .toast{position:fixed;left:50%;top:64px;transform:translateX(-50%) translateY(-16px);background:var(--bg4);border:1px solid var(--gold-border,rgba(212,175,55,.32));color:var(--text);padding:12px 18px;border-radius:10px;font-size:var(--fs-corpo);font-weight:600;opacity:0;transition:.25s;z-index:200;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.45);max-width:calc(100vw - 32px);text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  @media print{
    :root{--bg:#fff;--bg2:#fff;--bg3:#f4f4f4;--bg4:#eee;--border:#ccc;--text:#111;--white:#111;--slate:#333;--muted:#555}
    .top,.share,.toast,button{display:none!important}
    body{background:#fff!important}
  }
</style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="mono" href="/" title="Início" aria-label="Início">YTB</a>
      <span class="who" id="who">—</span>
      <button id="btn-trocar" type="button" style="display:none" title="Trocar de atleta">↔</button>
      <button id="btn-share-top" type="button">Partilhar</button>
      <button id="btn-exit" type="button">Sair</button>
    </div>
  </header>

  <main class="wrap" id="app" aria-live="polite"></main>
  <div class="toast" id="toast" role="status"></div>

<script>
(function(){
  "use strict";
  var CFG=window.YTB_CONFIG||{};
  var URL_=CFG.SUPABASE_URL||'', KEY=CFG.SUPABASE_KEY||'';
  var USING_SB=!!(URL_&&KEY&&window.supabase);
  // a sessão a ler depende do modo: família (?atleta=) vive em 'ytb-familia-auth',
  // admin (?admin=) vive em 'ytb-auth', scout (?scout=), clube (?clube=) e
  // treinador (?treinador=) vivem na chave por omissão do SDK (essas páginas
  // não definem storageKey próprio). Escolhe a chave certa para não falhar o auth.jwt().
  var _sk='ytb-auth';
  try{ if(new URLSearchParams(location.search).get('atleta')) _sk='ytb-familia-auth'; }catch(e){}
  try{ if(new URLSearchParams(location.search).get('scout')) _sk=null; }catch(e){}
  try{ if(new URLSearchParams(location.search).get('clube')) _sk=null; }catch(e){}
  try{ if(new URLSearchParams(location.search).get('treinador')) _sk=null; }catch(e){}
  var _authOpts={persistSession:true,autoRefreshToken:true};
  if(_sk) _authOpts.storageKey=_sk;
  var supa=USING_SB?window.supabase.createClient(URL_,KEY,{auth:_authOpts}):null;

  // ── DEMO (Coutinho) — espelha a forma que o ytb_passaporte vai devolver ──
  var DEMO={
    identidade:{nome:"Coutinho",pos:"MC",pos_full:"Médio centro",clube:"Gondomar SC",escalao:"Sub-13",foto:""},
    evolucao:{pct24:31, serie:[60,63,62,68,67,75,74,82,85,90]},
    contexto:[["AF Porto","Associação"],["Sub-13","Escalão"],["Elite","Divisão"],["26","Jogos",1],["1820'","Min · pé dir.",1]],
    indicadores:{treinab:87,compromisso:92,consistencia:89,verificacao:"Scout + Treinador"},
    densidade:[["52","eventos"],["12","avaliações"],["4","observadores"],["3","épocas"]],
    dna:[["Compromisso",92,"obs"],["Consistência",89,"dec"],["Treinabilidade",87,"obs"],["Recuperação após pausa",83,"dec"],["Adesão aos planos",76,"dec"],["Competitividade",84,"obs"]],
    dnaStats:[["148h","Treino extra acumulado"],["há 2 dias","Último treino"]],
    atividade:[["64","Prescritos"],["58","Concluídos"],["6","Streak sem."],["148h","Horas"]],
    cognitivo:{acerto:80,total:142,tipos:[["Passe",83],["Condução",100],["Remate",60]],serie:[56,61,65,70,74,80]},
    marcos:[
      ["◆","Primeiro interesse de clube registado","há 5 dias"],
      ["◆","100 horas de treino extra","há 1 mês"],
      ["◆","Campeão Série 3 · Sub-13","época 25/26"],
      ["◆","Evolução acima de 25%","há 2 meses"],
      ["◆","Passaporte ativado","há 3 meses"]
    ],
    carreira:[
      ["2026","Gondomar SC","Sub-13 · Campeão Série 3"],
      ["2025","Gondomar SC","Sub-12"],
      ["2024","Dragon Force","Sub-11"],
      ["2023","Dragon Force","Sub-10"]
    ],
    timeline:[
      ["mar","Interesse de clube registado","marco de carreira","há 5 dias"],
      ["obs","Avaliação 360 <span class='up'>↑ +6</span>","régua v1 · peso 0.60","há 12 dias"],
      ["obs","Relatório de observação","FC Porto Sub-13 · jogo","há 3 sem"],
      ["dec","Treino concluído <span class='num'>×6</span>","YTB Elite · plano do treinador","esta sem."],
      ["mar","Consentimento do encarregado","passaporte ativado","há 3 meses"]
    ]
  };

  // ── helpers ──
  function el(html){var t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function curveSVG(serie,pct){
    var w=636,h=150,n=serie.length;
    var pts=serie.map(function(v,i){return [ +(i*(w/(n-1))).toFixed(1), +(h - (v/100)*(h*0.74) - h*0.08).toFixed(1) ];});
    var line=pts.map(function(p,i){return (i?'L':'M')+p[0]+','+p[1];}).join(' ');
    var area=line+' L'+w+','+h+' L0,'+h+' Z';
    var dots=pts.slice(-3).map(function(p,i){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(i===2?4:3)+'" fill="#ECEFEA"/>';}).join('');
    var pctTxt = (pct==null) ? '<span class="v-vazio">—</span>' : ((pct>=0?'+':'')+pct+'%');
    var corHex = (pct!=null && pct<0) ? '#E0A458' : '#00D46A';
    return '<div class="curvebox"><div class="cap"><div class="big num" style="color:'+corHex+'">'+pctTxt+'</div><div class="lbl">Evolução · 24 meses</div></div>'+
      '<svg class="curve" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true">'+
      '<defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+corHex+'" stop-opacity=".15"/><stop offset="1" stop-color="'+corHex+'" stop-opacity="0"/></linearGradient></defs>'+
      '<path d="'+area+'" fill="url(#cg)"/><path d="'+line+'" fill="none" stroke="'+corHex+'" stroke-width="2.2"/>'+dots+'</svg></div>';
  }

  var FALTA_LBL={sexo:'sexo do atleta',altura_pai:'altura do pai',altura_mae:'altura da mãe',altura_atual:'uma medição de altura'};
  function morfoHTML(m){
    var lock='<span class="lock">🔒 Privado · família · treinador · scout autorizado. Nunca visível ao público.</span>';
    if(!m){
      return '<div class="panel morfo">'+lock+'<div class="derived">Ainda sem dados para estimar a maturação.</div></div>';
    }
    function cell(l,v){ return '<div class="f"><div class="l">'+l+'</div><div class="v">'+(v!=null&&v!==''?esc(String(v)):'—')+'</div></div>'; }
    var faixaTxt=(m.altura_prevista_min!=null&&m.altura_prevista_max!=null)?(m.altura_prevista_min+'–'+m.altura_prevista_max+' cm'):null;
    var fields='<div class="fields">'+
      cell('Altura atual', m.altura_atual!=null?(m.altura_atual+' cm'):null)+
      cell('Faixa provável na idade adulta', faixaTxt)+
      cell('Crescimento', m.velocidade_cm_ano!=null?(m.velocidade_cm_ano+' cm/ano'):null)+
      '</div>';
    var barra='';
    if(m.estado==='acima_da_faixa'){
      barra='<div style="font-size:var(--fs-corpo);color:var(--slate);margin-top:12px;line-height:1.45">Já cresceu além da faixa provável a partir da altura dos pais — não é um erro, acontece. A partir daqui, o histórico de medições conta mais do que esta estimativa de partida.</div>';
    } else if(m.pct_atingida!=null){
      var p=Math.max(0,Math.min(100,m.pct_atingida));
      var extra=(m.faltam_cm!=null&&m.faltam_cm>0)?(' · faltam ~'+m.faltam_cm+' cm até ao topo da faixa.'):'.';
      barra='<div class="barx" style="margin-top:12px"><i style="width:'+p+'%;background:var(--obs-bar)"></i></div>'+
        '<div style="font-size:var(--fs-corpo);color:var(--slate);margin-top:6px;line-height:1.45">'+(m.estado==='na_faixa'?'Já está dentro da faixa provável':('Está a ~'+m.pct_atingida+'% do centro da faixa provável'))+extra+'</div>';
    }
    var aviso='';
    if(m.em_falta&&m.em_falta.length){
      var partes=m.em_falta.map(function(k){return FALTA_LBL[k]||k;});
      aviso='<div class="derived">Para completar a estimativa, falta: '+esc(partes.join(', '))+'.</div>';
    }
    var metodo='<div class="derived" style="opacity:.8">'+esc(m.metodo||'Estimativa')+'.</div>';
    return '<div class="panel morfo">'+lock+fields+barra+aviso+metodo+'</div>';
  }

  /* Leitura de contexto por IA — interpretação, não observação.
     Vai sempre acompanhada de quando, por quem e com que dados foi feita:
     uma síntese sem rasto até aos factos é opinião disfarçada de facto. */
  /* Radar das 5 áreas que o treinador avalia — a mesma forma de um cartão de
     jogo, com o conteúdo trocado: sem rating geral, sem badge de crescimento,
     sem número em cada eixo. Só a forma (onde está mais forte agora) e uma
     seta de tendência por área. Nunca visível a scout/clube — mesmo portão
     que já protege a leitura de contexto e a maturação. */
  function radarAreasHTML(p){
    var areas=p.areas||[]; if(!areas.length) return '';
    var cx=160, cy=132, maxR=92, n=areas.length;
    var pontos=areas.map(function(a,i){
      var ang=-Math.PI/2 + i*2*Math.PI/n;
      var r=maxR*Math.max(0.14,(a.v||0)/5);
      return [cx+r*Math.cos(ang), cy+r*Math.sin(ang)];
    });
    var poly=pontos.map(function(pt){return pt[0].toFixed(1)+','+pt[1].toFixed(1);}).join(' ');
    var grid=[0.33,0.66,1].map(function(frac){
      var gp=areas.map(function(a,i){ var ang=-Math.PI/2+i*2*Math.PI/n; return (cx+maxR*frac*Math.cos(ang)).toFixed(1)+','+(cy+maxR*frac*Math.sin(ang)).toFixed(1); }).join(' ');
      return '<polygon points="'+gp+'" fill="none" stroke="var(--border)" stroke-width="1" opacity="'+(frac===1?0.5:0.25)+'"/>';
    }).join('');
    var eixos=areas.map(function(a,i){
      var ang=-Math.PI/2+i*2*Math.PI/n;
      return '<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+maxR*Math.cos(ang)).toFixed(1)+'" y2="'+(cy+maxR*Math.sin(ang)).toFixed(1)+'" stroke="var(--border)" stroke-width="1" opacity=".35"/>';
    }).join('');
    var TSETA={subir:['↗','var(--up)'],estavel:['→','var(--slate)'],descer:['↘','var(--orange, #E8A33D)']};
    var labels=areas.map(function(a,i){
      var ang=-Math.PI/2+i*2*Math.PI/n, lr=maxR+26;
      var lx=cx+lr*Math.cos(ang), ly=cy+lr*Math.sin(ang);
      var seta=a.t?TSETA[a.t]:['·','var(--dim, var(--slate))'];
      return '<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="middle" dominant-baseline="middle" font-family="Plus Jakarta Sans" font-size="11" font-weight="700" fill="var(--slate)">'+esc(a.l)+'</text>'
        +'<text x="'+lx.toFixed(1)+'" y="'+(ly+13).toFixed(1)+'" text-anchor="middle" dominant-baseline="middle" font-family="Plus Jakarta Sans" font-size="12" font-weight="800" fill="'+seta[1]+'">'+seta[0]+'</text>';
    }).join('');
    var em=(p.em||'').slice(0,10);
    return '<div class="panel" style="text-align:center">'
      +'<svg viewBox="0 0 320 264" style="width:100%;max-width:320px;margin:4px auto 0;display:block">'
      +grid+eixos+'<polygon points="'+poly+'" fill="var(--gold)" fill-opacity=".18" stroke="var(--gold)" stroke-width="2"/>'
      +pontos.map(function(pt){return '<circle cx="'+pt[0].toFixed(1)+'" cy="'+pt[1].toFixed(1)+'" r="3.5" fill="var(--gold)"/>';}).join('')
      +labels+'</svg>'
      +'<div style="font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5">Forma da última avaliação do treinador ('+esc(em)+'). A seta compara com a anterior — não é uma nota, é para onde está a ir.</div>'
      +'</div>';
  }
  function contextoIAHTML(c){
    var base=c.base||{}, quais=[];
    if(base.divisao) quais.push('divisão: '+base.divisao);
    if(base.golos!=null) quais.push(base.golos+' golos');
    if(base.jogos!=null) quais.push(base.jogos+' jogos');
    if(base.golos_equipa!=null) quais.push(base.golos_equipa+' golos da equipa');
    if(base.classificacao) quais.push(base.classificacao);
    var dt=(c.em||'').slice(0,10);
    return '<div class="panel">'
      +'<div style="font-size:14.5px;color:var(--text);line-height:1.6">'+esc(c.texto)+'</div>'
      +'<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);line-height:1.5">'
      +'Leitura gerada por IA em '+esc(dt)+(c.por?(' · pedida por '+esc(String(c.por).split('@')[0])):'')+'.<br>'
      +'É interpretação dos números, não uma observação de quem o viu jogar.'
      +(quais.length?('<br>Baseada em: '+esc(quais.join(' · '))):'<br>Sem contexto competitivo preenchido — por isso diz o que diz.')
      +'</div></div>';
  }
  function devScoreHTML(ds){
    if(ds.estado==='em_pausa'){
      return '<div class="panel"><div style="font-size:var(--fs-corpo);font-weight:800;margin-bottom:6px">🏖️ Época em pausa</div><div class="sub" style="margin:0">Estamos em férias — o score não desce enquanto não há treinos. Quando a época recomeçar, o relógio volta a contar. As missões e o Elite Coach continuam disponíveis, e só podem somar.</div></div>';
    }
    if(ds.estado!=='ok'){
      return '<div class="panel"><div class="sub" style="margin:0">O score está a construir-se — cumpre as missões da semana e regista os jogos. Precisa de pelo menos 2 avaliações do treinador em dias diferentes ou 4 semanas de atividade.</div></div>';
    }
    var tend={subiu:['↗ a subir','var(--up)'],estavel:['→ estável','var(--slate)'],desceu:['↘ a descer','var(--orange, #E8A33D)']}[ds.tendencia]||['',''];
    var c=ds.componentes||{};
    var linhas=[];
    if(c.adesao) linhas.push(['Missões cumpridas', c.adesao.feitas+' de '+Math.round(c.adesao.esperadas), Math.round((c.adesao.ratio||0)*100)]);
    if(c.consistencia) linhas.push(['Consistência', c.consistencia.semanas_ativas+' de '+Math.round(c.consistencia.de)+' semanas', Math.round((c.consistencia.ratio||0)*100)]);
    if(c.tendencia) linhas.push(['Avaliação do treinador', c.tendencia.de+' → '+c.tendencia.para, Math.round(((c.tendencia.delta+0.5)/1)*100)]);
    if(c.cognitivo) linhas.push(['Decisões certas', c.cognitivo.certos+' de '+c.cognitivo.total, Math.round(100*c.cognitivo.certos/Math.max(1,c.cognitivo.total))]);
    var desde=ds.desde?new Date(ds.desde).toLocaleDateString('pt-PT',{day:'numeric',month:'short'}):'';
    return '<div class="panel">'+
      '<div style="display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap">'+
        '<div><div class="num" style="font-family:\'Barlow Condensed\',sans-serif;font-weight:900;font-size:var(--fs-hero);line-height:.9;color:var(--up)">'+ds.score+'</div>'+
        '<div style="font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-top:5px">de 100</div></div>'+
        (tend[0]?'<div style="font-size:var(--fs-corpo);font-weight:700;color:'+tend[1]+';padding-bottom:14px">'+tend[0]+'</div>':'')+
        (ds.em_pausa?'<div style="font-size:var(--fs-legenda);font-weight:700;color:var(--slate);padding-bottom:14px">🏖️ férias — o relógio está parado, o score não desce</div>':'')+
      '</div>'+
      '<div class="barx" style="margin-top:12px"><i style="width:'+Math.max(0,Math.min(100,ds.score))+'%;background:var(--up)"></i></div>'+
      '<div class="sub" style="margin:10px 0 0">Mede o teu desenvolvimento — não o teu talento. Compara-te só contigo próprio'+(desde?(', desde '+esc(desde)):'')+'. Sobe com missões cumpridas, consistência e a avaliação do treinador.</div>'+
      (linhas.length?('<div class="dna-grid" style="margin-top:14px">'+linhas.map(function(l){
        return '<div class="trait"><div class="tl"><span>'+esc(l[0])+'</span><b class="num" style="color:var(--text)">'+esc(l[1])+'</b></div><div class="barx"><i style="width:'+Math.max(0,Math.min(100,l[2]))+'%;background:var(--obs-bar)"></i></div></div>';
      }).join('')+'</div>'):'')+
      '</div>';
  }

  function render(d){
    var id=d.identidade, ind=d.indicadores;
    var html='<section id="grupo-filho" class="fam-group"><div class="fam-group-head"><span class="eyebrow">Eu</span><h2>Como estou</h2><p class="fam-lede">O que já sei sobre mim, resumido — a evidência completa fica no Passaporte.</p></div>';
    // identidade + curva
    html+='<div class="pcard"><div class="head">'+
      '<div class="photo">'+(id.foto?'<div class="pp" style="background-image:url('+esc(id.foto)+')"></div>':'')+'</div>'+
      '<div class="idblock"><div class="name">'+esc(id.nome)+'</div><div class="meta"><span class="pos">'+esc(id.pos)+'</span>'+esc(id.clube)+' · '+esc(id.pos_full)+'</div></div>'+
      '<div class="selo"><span class="v">✓</span><span class="src">'+esc(ind.verificacao)+'</span></div>'+
      '</div></div>';
    // contexto
    html+='<div class="ctx">'+d.contexto.map(function(c){return '<div><div class="v'+(c[2]?' num':'')+'">'+esc(c[0])+'</div><div class="l">'+esc(c[1])+'</div></div>';}).join('')+'</div>';
    // 3 primários — mostra '—' quando ainda não há dados reais, nunca
    // um número que pareça calculado (0 ou 100 falsos escondem por
    // completo a ausência de avaliações)
    function tileVal(v, suf){ return v==null ? '<span class="v-vazio">—</span>' : (v+(suf||'')); }
    html+='<div class="prim">'+
      '<div class="tile"><div class="l">Treinabilidade</div><div class="v obs num">'+tileVal(ind.treinab)+'</div></div>'+
      '<div class="tile"><div class="l">Compromisso</div><div class="v obs num">'+tileVal(ind.compromisso)+'</div></div>'+
      '<div class="tile"><div class="l">Consistência</div><div class="v dec num">'+tileVal(ind.consistencia)+'</div></div>'+
      '</div>';
    // "nenhum — órfão": se falta treinabilidade ou compromisso, explica
    // quem os produz (o treinador, não a plataforma) — nunca deixar um
    // traço sozinho sem dizer o que falta e a quem pertence produzi-lo
    if(ind.treinab==null || ind.compromisso==null){
      html+='<div class="vazio-explicado" style="margin-top:8px"><p>Treinabilidade e compromisso vêm da avaliação do treinador — ainda '+(ind.treinab==null&&ind.compromisso==null?'não há nenhuma':'não há avaliações suficientes')+' registada'+(ind.treinab==null&&ind.compromisso==null?'':'s')+'.</p></div>';
    }
    // pentagrama simples — a evidência semanal detalhada (5 deltas) fica
    // atrás de "Ver mais", não na primeira vista
    if(d.perfilAreas && d.perfilAreas.areas){ html+=radarAreasHTML(d.perfilAreas); }
    else { html+='<div class="vazio-explicado"><b>Ainda sem áreas de desenvolvimento definidas.</b><p>Aparecem aqui assim que o treinador fizer a primeira avaliação, ou à medida que o treino for registado.</p></div>'; }
    if(d.evolucaoSemanalAreas && d.evolucaoSemanalAreas.areas){
      var icoEvo={tecnica:'⚽',decisao:'🧠',tatica:'🧭',fisico:'⚡',mental:'🔥'};
      var labelCurto={tecnica:'Téc',decisao:'Dec',tatica:'Tát',fisico:'Fís',mental:'Men'};
      html+='<details class="ver-mais"><summary>Ver evolução desta semana</summary>'+
        '<div class="evosemanal"><div class="evosemanal-tit">Evolução desta semana</div>'+
        '<div class="evosemanal-grid">'+d.evolucaoSemanalAreas.areas.map(function(a){
          var delta=a.delta||0;
          var cls=delta>0?'up':(delta<0?'down':'obs');
          var txt=delta===0?'<span class="v-vazio">—</span>':((delta>0?'+':'')+delta);
          return '<div class="evosemanal-item"><div class="evosemanal-ico">'+(icoEvo[a.k]||'')+'</div>'+
            '<div class="evosemanal-l" title="'+esc(a.l)+'">'+esc(labelCurto[a.k]||a.l)+'</div>'+
            '<div class="evosemanal-v '+cls+'">'+txt+'</div></div>';
        }).join('')+'</div>'+
        '<div class="evosemanal-legenda">'+esc(d.evolucaoSemanalAreas.legenda||'')+'</div>'+
        '</div></details>';
    }
    html+='<div id="fam-tools-slot"></div>';
    html+='</section>';
    // ===== PASSAPORTE (evidência profunda — épocas, marcos, avaliações, timeline) =====
    html+='<section id="grupo-passaporte" class="fam-group"><div class="fam-group-head"><span class="eyebrow">O Passaporte</span><h2>O meu percurso</h2><p class="fam-lede">Tudo o que já ficou registado: quem me observou, como evoluí, que épocas já fiz. Isto não se apaga e vai comigo para onde for.</p></div>';
    html+='<div class="dens"><span class="lab">Densidade do retrato</span>'+d.densidade.map(function(x){return '<i><b class="num">'+x[0]+'</b>'+x[1]+'</i>';}).join('')+'</div>';
    // legenda
    html+='<div class="legend">'+
      '<i><span class="dot" style="background:var(--obs-bar)"></span>observado (scout/treinador)</i>'+
      '<i><span class="dot" style="background:var(--dec-bar2)"></span>declarado (família)</i>'+
      '<i><span class="dot" style="background:var(--gold)"></span>verificação · selo</i></div>';
    // DNA
    html+='<div class="shead">DNA do Atleta</div><div class="panel">'+
      '<div class="hd"><h3>Comportamento acumulado</h3><span class="badge">difícil de copiar</span></div>'+
      '<div class="sub">Construído ao longo de 3 épocas. Não é um snapshot — é um padrão.</div><div class="dna-grid">'+
      d.dna.map(function(t){var bar=t[2]==='obs'?'var(--obs-bar)':'var(--dec-bar2)';
        return '<div class="trait"><div class="tl"><span>'+esc(t[0])+'</span><b class="'+t[2]+' num">'+t[1]+'</b></div><div class="barx"><i style="width:'+t[1]+'%;background:'+bar+'"></i></div></div>';}).join('')+
      '</div><div class="stats">'+d.dnaStats.map(function(s){return '<div><div class="v num">'+esc(s[0])+'</div><div class="l">'+esc(s[1])+'</div></div>';}).join('')+'</div></div>';
    // atividade
    html+='<div class="shead">Atividade</div><div class="act">'+d.atividade.map(function(a){return '<div class="cell"><div class="v num">'+esc(a[0])+'</div><div class="l">'+esc(a[1])+'</div></div>';}).join('')+'</div>';
    // inteligência de jogo (Elite Coach)
    var cg=d.cognitivo, cgT=(cg&&cg.serie&&cg.serie.length>1)?(cg.serie[cg.serie.length-1]-cg.serie[0]):0;
    if(cg){ html+='<div class="shead">Inteligência de Jogo</div><div class="panel">'+

        '<div style="flex:0 0 auto"><div class="num" style="font-family:Barlow Condensed,sans-serif;font-weight:900;font-size:var(--fs-titulo);line-height:1">'+cg.total+'</div><div style="font-size:var(--fs-legenda);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:4px">decisões</div></div>'+
        (cgT>0?'<div style="flex:0 0 auto;margin-left:auto;color:var(--up);font-size:var(--fs-corpo);font-weight:600;white-space:nowrap">↗ +'+cgT+' nos últimos meses</div>':'')+
      '</div>'+
      '<div class="dna-grid" style="margin-top:16px">'+cg.tipos.map(function(t){return '<div class="trait"><div class="tl"><span>'+esc(t[0])+'</span><b class="obs num">'+t[1]+'%</b></div><div class="barx"><i style="width:'+t[1]+'%;background:var(--obs-bar)"></i></div></div>';}).join('')+'</div>'+
      '</div>'; }
    // Development Score — mede desenvolvimento, nunca talento; só contra o
    // próprio histórico (sem comparações entre atletas, por desenho)
    if(d.devScore){ html+='<div class="shead">Development Score</div>'+devScoreHTML(d.devScore); }
    // (pentagrama já aparece em "O teu filho" — não repetir aqui)
    if(d.contextoIA && d.contextoIA.texto){ html+='<details class="ver-mais"><summary>Ver leitura de contexto</summary><div class="shead">Leitura de contexto</div>'+contextoIAHTML(d.contextoIA)+'</details>'; }
    // marcos
    html+='<div class="shead">Marcos da Carreira</div><div class="marcos">'+d.marcos.map(function(m){return '<div class="marco"><span class="ic">'+m[0]+'</span><span class="tt">'+esc(m[1])+'</span><span class="wn">'+esc(m[2])+'</span></div>';}).join('')+'</div>';

    html+='<div class="shead">Carreira</div><div class="panel car">'+
      (d.carreira.length
        ? d.carreira.map(function(c){return '<div class="item"><div class="yr num">'+esc(c[0])+'</div><div class="cl">'+esc(c[1])+'<small>'+esc(c[2])+'</small></div></div>';}).join('')
        : '<div class="sub" style="margin:0">O percurso ainda não foi registado — a família pode preenchê-lo época a época, mais abaixo.</div>')
      +'</div>';
    // morfologia & maturação (estimativa; nunca pública)
    html+='<div class="shead">Morfologia &amp; Maturação</div>'+morfoHTML(d.maturacao);
    // timeline
    var pill={mar:'mar',obs:'obs',dec:'dec'}, mk={mar:'<span class="mk" style="color:var(--gold)">◆</span>',obs:'<span class="mk" style="color:var(--obs-bar)">•</span>',dec:'<span class="mk" style="color:var(--dec)">·</span>'};

    html+='<div class="shead">Linha temporal</div><div class="tl-list">'+d.timeline.map(function(r){
      return '<div class="tl-row vivo-reveal'+(r[0]==='mar'?' vivo-tl-marco':'')+'">'+mk[r[0]]+'<div class="ev"><div class="t">'+r[1]+'</div><div class="s">'+esc(r[2])+'</div></div><span class="pill '+pill[r[0]]+'">'+plabel[r[0]]+'</span><span class="when">'+esc(r[3])+'</span></div>';
    }).join('')+'</div>';
    // partilhar + rodapé

  function cortar(s,n){ s=String(s||''); return s.length>n ? s.slice(0,n-1).trim()+'…' : s; }
  function svgParaPngBlob(svgStr, w, h){
    return new Promise(function(resolve,reject){
      var blob = new Blob([svgStr], {type:'image/svg+xml;charset=utf-8'});
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function(){
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        canvas.toBlob(function(b){ b?resolve(b):reject(new Error('canvas vazio')); }, 'image/png');
      };
      img.onerror = function(e){ URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
  }
  async function partilharCartaoImagem(d){

      var nomeFicheiro = 'passaporte-'+(d.identidade.nome||'atleta').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.png';
      var file = new File([blob], nomeFicheiro, {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:'Passaporte do Atleta', text:(d.identidade.nome||'')+' — YourTalentBase'});
      } else {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a'); a.href=url; a.download=nomeFicheiro;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){URL.revokeObjectURL(url);}, 4000);
        toast('Imagem descarregada — já podes partilhar');
      }
    }catch(e){ toast('Não foi possível gerar a imagem'); }
    if(btn) btn.disabled = false;
  }

  // ── tradutor: forma semântica do ytb_passaporte → forma do render ──
  function relTime(iso){
    if(!iso) return '';
    var then=new Date(iso), now=new Date(), d=Math.floor((now-then)/86400000);
    if(isNaN(d)) return '';
    if(d<=0) return 'hoje'; if(d===1) return 'ontem';
    if(d<7) return 'há '+d+' dias';
    if(d<14) return 'há 1 sem'; if(d<31) return 'há '+Math.floor(d/7)+' sem';
    if(d<365){ var m=Math.max(1,Math.round(d/30)); return 'há '+m+(m===1?' mês':' meses'); }
    var y=Math.floor(d/365); return 'há '+y+(y===1?' ano':' anos');
  }

  function mapFromRPC(r){

                ['Treinabilidade',ind.treinabilidade,'obs'],['Adesão aos planos',ind.adesao_plano,'dec'],

    var dna=dnaSrc.filter(function(t){return t[1]!==null&&t[1]!==undefined;}).map(function(t){return [t[0],Math.round(t[1]),t[2]];});
    var temCog=!!(cg&&cg.total>0);
    return {
      identidade:{nome:id.nome||'—', pos:id.posicao||'', pos_full:id.posicao||'', clube:id.clube||'', escalao:id.escalao||'', foto:id.foto||''},

      contexto:[[id.associacao||'—','Associação'],[id.escalao||'—','Escalão']],
      indicadores:{treinab:(ind.treinabilidade==null?null:Math.round(ind.treinabilidade)), compromisso:(ind.compromisso==null?null:Math.round(ind.compromisso)), consistencia:(ind.consistencia==null?null:Math.round(ind.consistencia)), verificacao:verifLabel(ind.nivel_verificacao)},

        +'<div id="ck-dots" style="display:flex;gap:7px;margin-bottom:4px">'

        +'</div>'

  // ===== CALENDÁRIO DE JOGOS (035d): a família marca; a app pergunta depois =====
  function fmtJogoData(iso){
    var d=new Date(iso);
    var s=d.toLocaleDateString('pt-PT',{weekday:'short',day:'2-digit',month:'short'});
    var h=d.getHours(), m=d.getMinutes();
    if(h||m) s+=' '+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
    return s;
  }

    for(var w=0;w<T.plano.length;w++){ var pend=false; for(var s=0;s<(T.plano[w].sessoes||[]).length;s++){ if(!isFeita(w,s)){pend=true;break;} } if(pend){wi=w;break;} }

    (sem.sessoes||[]).forEach(function(sess,si){ (sess||[]).forEach(function(ex){ exercicios.push({nome:ex.nome,objetivo:ex.objetivo||ex.obj,desc:ex.desc,tempo:ex.tempo,sessao:si+1}); }); });
    var prox=T.plano[wi+1];

    function fim(){ if(btn){btn.disabled=false;btn.textContent='⬇ Exportar Plano em PDF';} }
    YTBExport.planoPDF({
      atletaId:T.atleta, atletaNome:(d&&d.identidade&&d.identidade.nome)||'Atleta',
      clube:(d&&d.identidade&&d.identidade.clube)||'', escalao:(d&&d.identidade&&d.identidade.escalao)||'',
      treinadorNome:T.treinadorNome, semanaAtual:wi+1, totalSemanas:T.plano.length,
      cicloNome:ciclo.nome||'', cicloDescricao:ciclo.descricao||ciclo.desc||'',
      exercicios:exercicios, proximoObjetivo:proximoObjetivo
    }).then(fim).catch(function(){ fim(); toast('Não foi possível gerar o PDF'); });
  };

  function montarJornadaPP(){
    var mount=document.getElementById('pp-jornada');
    if(!mount||!window.YTBVivo||!window.__raw) return;
    var r=window.__raw, den=r.densidade||{}, ind=r.indicadores||{}, at=r.atividade||{};
    var T=window.__treino||{};
    var temAval=(den.avaliacoes||0)>0;
    var temPlano=!!(T.plano&&T.plano.length);
    var temTreinos=((T.feitas||[]).length>0)||((at.concluidos||0)>0);
    var evol=(ind.evolucao_pct||0)>0||((r.marcos||[]).length>0);
    var temScout=((r.relatorios||[]).length>0);
    var temInteresse=(den.interesses||0)>0;
    var flags=[true,temAval,temPlano,temTreinos,true,evol,temScout,temInteresse];
    var atual=flags.indexOf(false); if(atual===-1)atual=flags.length-1;
    var nomes=['Inscrição','Avaliação','Plano','Treinos','Passaporte','Evolução','Scout Report','Oportunidades'];
    var etapas=nomes.map(function(nm,i){ return {nome:nm,estado:flags[i]?'done':(i===atual?'atual':'futuro')}; });
    etapas[2].dica=temPlano?'Plano do treinador ativo':'Chega quando o treinador prescrever';
    etapas[6].dica=temScout?'Observação profissional no passaporte':'Quando um scout observar o atleta';
    etapas[7].dica=temInteresse?'Um clube mostrou interesse — a YTB contacta-te':'Liga a visibilidade para clubes na secção Privacidade';
    if(temPlano) etapas[3].click=function(){ var s=document.getElementById('tr-sec'); if(s)s.scrollIntoView({behavior:'smooth'}); };
    YTBVivo.jornada(mount,etapas,{aria:'Jornada de '+((r.identidade&&r.identidade.nome)||'atleta')});
  }

  function carregarDiarioHistorico(){
    var el=document.getElementById('di-hist'); if(!el || !window.__famAtleta) return;
    supa.rpc('ytb_diario_historico',{p_atleta:window.__famAtleta,p_limit:8}).then(function(res){
      var d=res&&res.data;
      if(!d||!d.ok||!d.registos||!d.registos.length){ el.innerHTML=''; return; }
      var ICONES={livre:'⚽',jogo:'🏟️',clube:'🏃',plano:'📋'};
      var CATS={tecnica:'Técnica',fisico:'Físico',decisao:'Decisão',tatica:'Tática',mental:'Mental'};
      function linha(r){
        var partes=[];
        if(r.categoria) partes.push(CATS[r.categoria]||r.categoria);
        if(r.minutos) partes.push(r.minutos+' min');
        if(r.repeticoes) partes.push(r.repeticoes+' repetições');
        var dt=r.criado_em?new Date(r.criado_em).toLocaleDateString('pt-PT'):'';
        return '<div style="display:flex;justify-content:space-between;gap:10px;font-size:var(--fs-corpo);padding:8px 0;border-bottom:1px solid var(--border)">'
          +'<div><span style="margin-right:6px">'+(ICONES[r.atividade]||'📝')+'</span>'+esc(partes.join(' · ')||'—')+(r.feedback?'<div style="color:var(--slate);font-size:var(--fs-legenda);margin-top:2px">"'+esc(r.feedback)+'"</div>':'')+'</div>'
          +'<div style="color:var(--muted);font-size:var(--fs-legenda);white-space:nowrap">'+dt+'</div>'
          +'</div>';
      }
      // só os 2 mais recentes ficam visíveis de imediato — o resto (até
      // 8) fica atrás de "ver mais", para não criar uma lista enorme
      // logo à primeira vista
      var visiveis=d.registos.slice(0,2), resto=d.registos.slice(2);
      var html='<div class="sub" style="margin-bottom:8px;font-size:var(--fs-legenda)">Últimos registos</div>'
        + visiveis.map(linha).join('');
      if(resto.length){
        html+='<details class="ver-mais"><summary>Ver mais '+resto.length+'</summary>'+resto.map(linha).join('')+'</details>';
      }
      el.innerHTML=html;
    }).catch(function(){});
  }

  function carregarCarreiraLista(){
    var el=document.getElementById('car-lista'); if(!el) return;
    supa.rpc('ytb_carreira_lista',{p_atleta:window.__famAtleta}).then(function(res){
      if(res&&res.error){ el.innerHTML='<div style="font-size:var(--fs-corpo);color:var(--red)">Sessão expirada — entra de novo para ver a carreira.</div>'; return; }
      var l=res&&res.data;
      if(l===null){ el.innerHTML='<div style="font-size:var(--fs-corpo);color:var(--red)">Sem acesso a este atleta.</div>'; return; }
      l=l||[];
      if(!l.length){ el.innerHTML='<div style="font-size:var(--fs-corpo);color:var(--muted)">Ainda sem épocas registadas.</div>'; return; }
      el.innerHTML=l.map(function(c){
        var tit=(c.titulos&&c.titulos.length)?(' · <span style="color:var(--gold)">🏆 '+esc(c.titulos.join(' · '))+'</span>'):(c.classificacao?(' · '+esc(c.classificacao)):'');
        var st=[];
        if(c.golos!=null)st.push(c.golos+' golo'+(c.golos===1?'':'s'));
        if(c.jogos!=null)st.push(c.jogos+' jogo'+(c.jogos===1?'':'s'));
        if(c.assist!=null)st.push(c.assist+' assist.');
        var stTxt=st.length?('<span style="display:block;font-size:var(--fs-legenda);color:var(--muted);margin-top:1px">'+esc(st.join(' · '))+'</span>'):'';
        return '<div style="display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--border);font-size:var(--fs-corpo)">'
          +'<b class="num" style="font-family:\'Barlow Condensed\',sans-serif;min-width:44px">'+esc(c.epoca)+'</b>'
          +'<span style="flex:1;color:var(--slate)">'+esc([c.clube,c.escalao,c.divisao].filter(Boolean).join(' · '))+tit+stTxt+'</span></div>';
      }).join('');
    }).catch(function(){ el.innerHTML='<div style="font-size:var(--fs-corpo);color:var(--red)">Sem ligação — tenta de novo.</div>'; });
  }
  window.__carreiraGravar=function(){
    function s(id){ var v=(document.getElementById(id).value||'').trim(); return v===''?null:v; }

    var b=document.getElementById('carreira-card').querySelector('.fam-btn');
    b.disabled=true; b.textContent='A guardar…';

      p_golos:n('car-golos'), p_jogos:n('car-jogos'), p_assistencias:n('car-assist'), p_minutos:n('car-minutos')
    }).then(function(res){
      var d=res&&res.data; b.disabled=false; b.textContent='Guardar época →';

        var motivos={epoca_invalida:'época no formato 24/25', clube_escalao_obrigatorios:'clube e escalão são obrigatórios', minutos_invalidos:'minutos inválidos'};
        toast('⚠ '+(motivos[(d&&d.motivo)]||'Não gravado')); return;

      ['car-epoca','car-clube','car-escalao','car-divisao','car-class','car-titulo','car-golos','car-jogos','car-assist','car-minutos'].forEach(function(id){ document.getElementById(id).value=''; });
      btnOK(b,'✓ Época guardada'); toast('Época guardada ✓ — já está no passaporte');

  function carregarPerfilForm(){
    supa.rpc('ytb_familia_perfil_atual',{p_atleta:window.__famAtleta}).then(function(res){
      if(res&&res.error){ console.warn('ytb_familia_perfil_atual falhou', res.error); toast('Sessão expirada — entra de novo para editar o perfil'); return; }
      var p=res&&res.data; if(!p) return;
      var set=function(id,v){ var el=document.getElementById(id); if(el&&v!=null) el.value=v; };
      set('pf-nome',p.nome); set('pf-ultnome',p.ultimo_nome); set('pf-ano',p.ano_nascimento); set('pf-mes',p.mes_nascimento); set('pf-dia',p.dia_nascimento); set('pf-sexo',p.sexo);
      set('pf-clube',p.clube_actual); set('pf-equipa',p.equipa); set('pf-escalao',p.escalao); set('pf-assoc',p.associacao);
      set('pf-pos',p.posicao_principal); set('pf-pe',p.pe_dominante); set('pf-zz',p.zerozero_url); set('pf-jp',p.joga_plus_url);
      set('pf-camnum',p.numero_camisola); set('pf-camnome',p.nome_camisola);
      set('pf-eenome',p.encarregado_nome); set('pf-eetel',p.encarregado_telefone);
      set('ep-ref',p.epoca_ref); set('ep-div',p.divisao); set('ep-golos',p.golos_epoca); set('ep-jogos',p.jogos_epoca);
      set('ep-assist',p.assist_epoca); set('ep-minutos',p.minutos_epoca); set('ep-goleq',p.golos_equipa_epoca); set('ep-class',p.classificacao_equipa);
      window.__perfilAtual=p;
      // perfil "completo" (nome + clube + escalão) mostra resumo com botão
      // editar, em vez do formulário inteiro sempre aberto — a mesma
      // logica do resto da app: so mostra o formulario quando falta
      // preencher, ou quando o proprio pede para editar
      var POS_LBL={}; POSICOES_FAM.forEach(function(x){ POS_LBL[x[0]]=x[1]; });
      if(p.nome && p.clube_actual && p.escalao){
        var linha2=[p.escalao, POS_LBL[p.posicao_principal]||null, p.clube_actual].filter(Boolean).join(' · ');
        document.getElementById('perfil-resumo').innerHTML=
          '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">'
          +'<div><b style="font-size:16px">'+esc(p.nome)+'</b><div class="sub" style="margin-top:2px">'+esc(linha2)+'</div></div>'
          +'<button class="fam-btn" style="width:auto;padding:9px 16px;flex-shrink:0" onclick="window.__perfilEditar()">Editar</button>'
          +'</div>';
        document.getElementById('perfil-resumo').style.display='block';
        document.getElementById('perfil-form').style.display='none';
      } else {
        document.getElementById('perfil-resumo').style.display='none';
        document.getElementById('perfil-form').style.display='block';
      }
      // estatísticas da época: resumo quando já há época + pelo menos um número
      if(p.epoca_ref && (p.golos_epoca!=null || p.jogos_epoca!=null || p.assist_epoca!=null)){
        var st=[];
        if(p.jogos_epoca!=null) st.push(p.jogos_epoca+' jogo'+(p.jogos_epoca===1?'':'s'));
        if(p.golos_epoca!=null) st.push(p.golos_epoca+' golo'+(p.golos_epoca===1?'':'s'));
        if(p.assist_epoca!=null) st.push(p.assist_epoca+' assist.');
        document.getElementById('epoca-resumo').innerHTML=
          '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">'
          +'<div><b style="font-size:16px">'+esc(p.epoca_ref)+'</b><div class="sub" style="margin-top:2px">'+esc(st.join(' · ')||'ainda sem números')+'</div></div>'
          +'<button class="fam-btn" style="width:auto;padding:9px 16px;flex-shrink:0" onclick="window.__epocaEditar()">Editar</button>'
          +'</div>';
        document.getElementById('epoca-resumo').style.display='block';
        document.getElementById('epoca-form').style.display='none';
      } else {
        document.getElementById('epoca-resumo').style.display='none';
        document.getElementById('epoca-form').style.display='block';
      }
    }).catch(function(e){ console.warn('ytb_familia_perfil_atual: sem ligação', e); });
  }

  var __famPivoIdx=0;
  function famPivoAltura(){
    var piv=document.getElementById('fam-pivot'); if(!piv) return;
    var grupos=piv.querySelectorAll('.fam-group');
    var g=grupos[__famPivoIdx];

  function famNav(){
    var app=document.getElementById('app'); if(!app) return;
    var head=document.getElementById('fam-pivo-head');
    var piv=document.getElementById('fam-pivot');
    if(!piv){
      head=document.createElement('nav'); head.id='fam-pivo-head'; head.className='fam-pivo-head';
      piv=document.createElement('div'); piv.id='fam-pivot';
      app.insertBefore(piv, app.firstChild);
      app.insertBefore(head, piv);
      // colar por BAIXO do header sticky do site, não por cima dele
      var topo=document.querySelector('.top');
      if(topo) head.style.top=topo.offsetHeight+'px';
      // e os sub-títulos colam por baixo dos dois (header + barra do pivot)
      function ajustarSheads(){
        var alt=(topo?topo.offsetHeight:0)+(head?head.offsetHeight:0);
        document.querySelectorAll('.shead').forEach(function(sh){ sh.style.top=alt+'px'; });
      }
      setTimeout(ajustarSheads,60); setTimeout(ajustarSheads,900);
      window.__famSheads=ajustarSheads;
      addEventListener('resize',ajustarSheads,{passive:true});
      // dica de deslize (uma vez por sessão)
      try{
        if(!sessionStorage.getItem('ytb-pivo-dica-fam')){
          var dica=document.createElement('div');
          dica.style.cssText='font-size:var(--fs-legenda);font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;padding:2px 2px 8px;pointer-events:none';
          dica.textContent='↔ desliza para os lados para mudar de secção';
          app.insertBefore(dica, piv);
          setTimeout(function(){ dica.style.transition='opacity .6s'; dica.style.opacity='0';
            setTimeout(function(){ if(dica.parentNode) dica.parentNode.removeChild(dica); },700); }, 4000);
          sessionStorage.setItem('ytb-pivo-dica-fam','1');
        }
      }catch(e){}
      // sincronizar o título com o deslize (índice pelo scroll nativo)
      var tm=null;
      piv.addEventListener('scroll', function(){
        if(tm) return;
        tm=setTimeout(function(){ tm=null;
          var w=piv.clientWidth||1;
          famPivoMarca(Math.round(piv.scrollLeft/w));
        },80);
      }, {passive:true});
      // conteúdo que cresce async (listas, cartas) → altura acompanha
      if(window.ResizeObserver && !piv.__ro){
        piv.__ro=new ResizeObserver(function(){ famPivoAltura(); });
      }
    }
    // adotar qualquer .fam-group que ainda viva fora do pivot (ex.: Privacidade, criada async)
    Array.prototype.slice.call(app.querySelectorAll('.fam-group')).forEach(function(g){
      if(g.parentNode!==piv) piv.appendChild(g);
      if(piv.__ro && !g.__roOn){ piv.__ro.observe(g); g.__roOn=true; }
    });
    var grupos=Array.prototype.slice.call(piv.querySelectorAll('.fam-group'));
    if(grupos.length<2){ document.body.classList.remove('fam-pivo'); piv.style.height=''; return; }
    document.body.classList.add('fam-pivo');
    head.innerHTML=grupos.map(function(g,i){
      var lbl=((g.querySelector('.fam-group-head h2')||{}).textContent)||((g.querySelector('.eyebrow')||{}).textContent)||g.id;
      return '<button type="button" data-i="'+i+'" onclick="__famPivoIr('+i+')">'+esc(lbl.toLowerCase())+'</button>';
    }).join('');
    famPivoMarca(Math.round((piv.scrollLeft||0)/(piv.clientWidth||1)));
    if(window.__famSheads) window.__famSheads();   // blocos novos também colam
  }
  function famPivoMarca(i){
    __famPivoIdx=Math.max(0,i||0);
    var head=document.getElementById('fam-pivo-head'); if(!head) return;
    var btns=head.querySelectorAll('button');
    btns.forEach(function(b,k){ b.classList.toggle('on', k===__famPivoIdx); });
    var on=btns[__famPivoIdx]; if(on && on.scrollIntoView) try{ on.scrollIntoView({inline:'start',block:'nearest',behavior:'smooth'}); }catch(e){}
    famPivoAltura();
  }
  window.__famPivoIr=function(i){
    var piv=document.getElementById('fam-pivot'); if(!piv) return;
    try{ piv.scrollTo({left:i*piv.clientWidth,behavior:'smooth'}); }catch(e){ piv.scrollLeft=i*piv.clientWidth; }
