<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Meu Painel · YourTalentBase</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080C08;--bg2:#0F1410;--bg3:#161D17;
  --gold:#D4AF37;--gold-soft:rgba(212,175,55,.15);--gold-border:rgba(212,175,55,.3);
  --gold-bright:#F5C842;--gold-deep:#A8862C;
  --green:#00D46A;--orange:#FFA500;--red:#FF4A4A;--blue:#4A9FE8;
  --border:#1F2520;--white:#fff;--slate:#aaa;--muted:#666;
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:#fff;min-height:100vh;-webkit-font-smoothing:antialiased}

.nav{position:sticky;top:0;z-index:50;background:rgba(8,12,8,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.nav-inner{max-width:760px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-b{width:32px;height:32px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:900;font-size:13px;color:#000}
.logo-n{font-family:'Barlow Condensed';font-weight:800;font-size:17px;letter-spacing:2px;color:#fff}
.logo-n span{color:var(--gold)}
.nav-tag{font-size:9px;font-weight:800;letter-spacing:2px;color:var(--gold);text-transform:uppercase;padding:3px 8px;border:1px solid var(--gold-border);background:rgba(212,175,55,.06)}

.container{max-width:760px;margin:0 auto;padding:24px 18px 60px}

.hero{margin-bottom:24px}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:6px}
.h1{font-family:'Barlow Condensed';font-weight:900;font-size:clamp(28px,6vw,40px);line-height:1;letter-spacing:-1px;margin-bottom:6px}
.h1 em{color:var(--gold);font-style:italic}
.sub{font-size:13px;color:var(--slate);line-height:1.5}
.sub strong{color:#fff}

.colab-bar{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--gold);padding:12px 14px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.colab-info{font-size:12px;color:var(--slate)}
.colab-info strong{color:#fff;font-size:14px;display:block;font-family:'Barlow Condensed';font-weight:900;letter-spacing:.3px}
.colab-count{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--gold);text-transform:uppercase;padding:4px 10px;border:1px solid var(--gold-border);background:rgba(212,175,55,.06)}

.atleta-card{background:var(--bg2);border:1px solid var(--border);margin-bottom:10px;overflow:hidden}
.atleta-head{padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
.atleta-avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-deep));display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:900;font-size:17px;color:#000;flex-shrink:0}
.atleta-avatar.gr{background:linear-gradient(135deg,#3FBF7F,#1A8C50);color:#fff}
.atleta-id{flex:1;min-width:0}
.atleta-nome{font-family:'Barlow Condensed';font-weight:900;font-size:17px;line-height:1;margin-bottom:3px}
.atleta-meta{font-size:11px;color:var(--slate)}
.fresh{font-size:9px;font-weight:800;letter-spacing:.5px;padding:3px 7px;text-transform:uppercase;white-space:nowrap}
.fresh-green{background:rgba(0,212,106,.1);color:var(--green);border:1px solid rgba(0,212,106,.3)}
.fresh-yellow{background:rgba(255,165,0,.1);color:var(--orange);border:1px solid rgba(255,165,0,.3)}
.fresh-red{background:rgba(255,74,74,.1);color:var(--red);border:1px solid rgba(255,74,74,.3)}
.fresh-none{background:var(--bg3);color:var(--muted);border:1px dashed var(--border)}
.chevron{color:var(--muted);font-size:14px;font-weight:900;transition:transform .2s;flex-shrink:0}
.atleta-card.open .chevron{transform:rotate(90deg);color:var(--gold)}

.atleta-body{display:none;padding:0 16px 16px;border-top:1px solid var(--border)}
.atleta-card.open .atleta-body{display:block}

.estado-tag{font-size:9px;font-weight:800;letter-spacing:1px;padding:2px 6px;text-transform:uppercase}
.estado-aprovado{background:rgba(0,212,106,.1);color:var(--green)}
.estado-pendente{background:rgba(255,165,0,.1);color:var(--orange)}

.sec-label{font-size:9px;font-weight:800;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin:16px 0 8px}

.stats-now{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.stat-box{background:var(--bg);border:1px solid var(--border);padding:8px 4px;text-align:center}
.stat-box-n{font-family:'Barlow Condensed';font-weight:900;font-size:18px;color:#fff;line-height:1}
.stat-box-l{font-size:7px;font-weight:800;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-top:3px}

.action-btns{display:flex;gap:6px;margin-top:10px}
.act{flex:1;padding:11px 8px;border:none;font-family:'Barlow Condensed';font-weight:900;font-size:11px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;text-align:center}
.act-gold{background:var(--gold);color:#000}
.act-gold:hover{background:var(--gold-bright)}
.act-ghost{background:transparent;color:#fff;border:1px solid var(--gold-border)}
.act-ghost:hover{background:var(--gold-soft)}

.panel{display:none;margin-top:10px;padding:14px;background:var(--bg);border:1px solid var(--gold-border)}
.panel.open{display:block;animation:slide .2s ease both}
@keyframes slide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.panel-title{font-family:'Barlow Condensed';font-weight:900;font-size:15px;color:var(--gold);margin-bottom:12px}

.field{margin-bottom:10px}
.field-lbl{font-size:9px;font-weight:700;letter-spacing:1px;color:var(--slate);text-transform:uppercase;margin-bottom:4px;display:block}
.field-in{width:100%;background:var(--bg2);border:1px solid var(--border);color:#fff;padding:10px 12px;font-size:13px;font-family:inherit;outline:none}
.field-in:focus{border-color:var(--gold)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.opt-group{display:flex;gap:5px;flex-wrap:wrap}
.opt{flex:1;min-width:64px;padding:9px 6px;background:var(--bg2);border:1px solid var(--border);color:#ccc;font-size:11px;font-weight:700;cursor:pointer;text-align:center;font-family:inherit}
.opt.sel{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}

.save-btn{width:100%;padding:12px;background:var(--gold);color:#000;border:none;font-family:'Barlow Condensed';font-weight:900;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;margin-top:6px}
.save-btn:hover{background:var(--gold-bright)}
.save-btn:disabled{background:var(--bg3);color:var(--muted);cursor:not-allowed}

.history{margin-top:10px}
.hist-item{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--bg2);border-left:2px solid var(--gold);margin-bottom:4px;font-size:11px;gap:8px}
.hist-date{font-weight:700;color:#fff}
.hist-detail{color:var(--slate);font-size:10px}

.loading{text-align:center;padding:60px 20px;color:var(--muted)}
.spinner{display:inline-block;width:32px;height:32px;border:2px solid rgba(212,175,55,.15);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:13px}
.empty-icon{font-size:40px;margin-bottom:10px;opacity:.4}
.empty a{color:var(--gold)}

.error-box{max-width:440px;margin:60px auto;background:var(--bg2);border:1px solid var(--red);padding:24px;text-align:center}
.error-box h2{font-family:'Barlow Condensed';font-weight:900;font-size:22px;color:var(--red);margin-bottom:8px}
.error-box p{font-size:13px;color:var(--slate);line-height:1.6;margin-bottom:14px}
.error-box a{color:var(--gold);text-decoration:none;font-weight:700}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gold);color:#000;padding:12px 20px;font-weight:800;font-size:12px;letter-spacing:1px;text-transform:uppercase;font-family:'Barlow Condensed';z-index:200;opacity:0;pointer-events:none;transition:all .3s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.toast.error{background:var(--red);color:#fff}

.footer{text-align:center;font-size:10px;color:var(--muted);padding:30px 18px}
.footer a{color:var(--slate);text-decoration:none;margin:0 6px}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="logo">
      <div class="logo-b">YT</div>
      <div class="logo-n">Your<span>Talent</span>Base</div>
    </a>
    <span class="nav-tag">🔑 O Meu Painel</span>
  </div>
</nav>

<div id="app">
  <div class="loading"><div class="spinner"></div></div>
</div>

<div class="toast" id="toast"></div>

<footer class="footer">
  © 2026 YourTalentBase · <a href="/">Home</a> · <a href="recuperar-link.html">Recuperar link</a>
</footer>

<script>
const SUPABASE_URL = 'https://nhshnplaiolxwcfuijfo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oc2hucGxhaW9seHdjZnVpamZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4NDQxNTAsImV4cCI6MjA4OTQyMDE1MH0.uyZiDun8495sjnHA6Wsk-Hou-3lubbNJfQqSYbMLSek';
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function escapeHtml(s){ if(s == null) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function getIniciais(p, u, n){
  if(p && u) return (p.charAt(0)+u.charAt(0)).toUpperCase();
  if(n){ const x = n.split(/\s+/); return x.length>=2 ? (x[0].charAt(0)+x[x.length-1].charAt(0)).toUpperCase() : x[0].slice(0,2).toUpperCase(); }
  return '?';
}
function toast(msg, err){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', !!err);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

function frescura(dataStr){
  if(!dataStr) return { cls:'fresh-none', txt:'Sem dados' };
  const dias = Math.floor((Date.now() - new Date(dataStr).getTime()) / 86400000);
  if(dias <= 30) return { cls:'fresh-green', txt:'Actualizado' };
  if(dias <= 90) return { cls:'fresh-yellow', txt:'Há ' + dias + ' dias' };
  return { cls:'fresh-red', txt:'Há ' + dias + ' dias' };
}

let colaborador = null;
let atletas = [];
let statsMap = {};
let reportsMap = {};

// estado dos forms (por atleta)
const formState = {};

async function init(){
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  if(!token){
    renderError('Link inválido', 'Este link não tem token de acesso. Usa o link completo que recebeste na inscrição.');
    return;
  }

  try {
    const { data: col, error: eCol } = await supa
      .from('atletas_360_colaboradores')
      .select('*')
      .eq('token_acesso', token)
      .maybeSingle();

    if(eCol) throw eCol;
    if(!col){
      renderError('Painel não encontrado', 'Este link não corresponde a nenhum colaborador. Verifica o link ou recupera-o com o teu email.');
      return;
    }
    colaborador = col;

    const { data: ats, error: eAt } = await supa
      .from('atletas_360')
      .select('*')
      .eq('colaborador_id', col.id)
      .order('created_at', { ascending: false });

    if(eAt) throw eAt;
    atletas = ats || [];

    if(atletas.length){
      const ids = atletas.map(a => a.id);
      const { data: stats } = await supa.from('atletas_360_stats').select('*').in('atleta_id', ids).eq('epoca','2025/26');
      (stats || []).forEach(s => statsMap[s.atleta_id] = s);

      const { data: reps } = await supa.from('atletas_360_match_reports').select('*').in('atleta_id', ids).order('data_jogo', { ascending: false });
      (reps || []).forEach(r => {
        if(!reportsMap[r.atleta_id]) reportsMap[r.atleta_id] = [];
        reportsMap[r.atleta_id].push(r);
      });
    }

    render();
  } catch(err){
    console.error(err);
    renderError('Erro a carregar', err.message || 'Tenta novamente daqui a pouco.');
  }
}

function renderError(titulo, msg){
  document.getElementById('app').innerHTML = `
    <div class="error-box">
      <h2>⚠ ${escapeHtml(titulo)}</h2>
      <p>${escapeHtml(msg)}</p>
      <a href="recuperar-link.html">Recuperar o meu link →</a>
    </div>
  `;
}

function render(){
  const tipoLabel = { pai:'Pai/Mãe', atleta:'Atleta', scout:'Scout', treinador:'Treinador', admin:'Admin YTB' }[colaborador.tipo] || colaborador.tipo;

  let html = `
    <div class="container">
      <div class="hero">
        <div class="eyebrow">🔑 Painel do Colaborador</div>
        <h1 class="h1">Olá, <em>${escapeHtml(colaborador.nome.split(' ')[0])}</em></h1>
        <p class="sub">Reporta jogos e mantém as estatísticas <strong>actualizadas</strong>. Quanto mais frescas, melhor a avaliação YTB.</p>
      </div>

      <div class="colab-bar">
        <div class="colab-info">
          <strong>${escapeHtml(colaborador.nome)}</strong>
          ${escapeHtml(tipoLabel)} · ${escapeHtml(colaborador.email)}
        </div>
        <div class="colab-count">${atletas.length} atleta${atletas.length === 1 ? '' : 's'}</div>
      </div>
  `;

  if(!atletas.length){
    html += `
      <div class="empty">
        <div class="empty-icon">⚽</div>
        Ainda não tens atletas inscritos com este email.<br>
        <a href="inscrever.html">Inscrever um atleta →</a>
      </div>
    `;
  } else {
    atletas.forEach(a => { html += renderAtleta(a); });
  }

  html += `</div>`;
  document.getElementById('app').innerHTML = html;

  // ligar eventos de toggle
  document.querySelectorAll('.atleta-head').forEach(el => {
    el.addEventListener('click', () => el.closest('.atleta-card').classList.toggle('open'));
  });
}

function renderAtleta(a){
  const ini = getIniciais(a.primeiro_nome, a.ultimo_nome, a.nome);
  const isGR = a.posicao_principal === 'GR';
  const s = statsMap[a.id];
  const fresh = frescura(a.stats_actualizadas_em);
  const reports = reportsMap[a.id] || [];
  const estadoTag = a.estado === 'aprovado'
    ? '<span class="estado-tag estado-aprovado">✓ Aprovado</span>'
    : '<span class="estado-tag estado-pendente">⏳ Pendente</span>';

  return `
    <div class="atleta-card" data-id="${a.id}">
      <div class="atleta-head">
        <div class="atleta-avatar ${isGR ? 'gr' : ''}">${ini}</div>
        <div class="atleta-id">
          <div class="atleta-nome">${escapeHtml(a.nome)}</div>
          <div class="atleta-meta">${escapeHtml(a.posicao_principal)} · ${escapeHtml(a.escalao)} · ${escapeHtml(a.clube_actual)}</div>
        </div>
        <span class="fresh ${fresh.cls}">${fresh.txt}</span>
        <span class="chevron">▶</span>
      </div>

      <div class="atleta-body">
        <div style="margin:12px 0 4px">${estadoTag}</div>

        <div class="sec-label">📊 Totais da época 2025/26</div>
        <div class="stats-now">
          <div class="stat-box"><div class="stat-box-n">${s ? (s.jogos||0) : 0}</div><div class="stat-box-l">Jogos</div></div>
          <div class="stat-box"><div class="stat-box-n">${s ? (s.minutos||0) : 0}</div><div class="stat-box-l">Minutos</div></div>
          <div class="stat-box"><div class="stat-box-n">${s ? (s.golos||0) : 0}</div><div class="stat-box-l">Golos</div></div>
          <div class="stat-box"><div class="stat-box-n">${s ? (s.assistencias||0) : 0}</div><div class="stat-box-l">Assists</div></div>
        </div>

        <div class="action-btns">
          <button class="act act-gold" onclick="togglePanel('${a.id}','report')">⚽ Reportar Jogo</button>
          <button class="act act-ghost" onclick="togglePanel('${a.id}','totais')">✏️ Corrigir Totais</button>
        </div>

        <!-- PANEL REPORT -->
        <div class="panel" id="panel-report-${a.id}">
          <div class="panel-title">⚽ Reportar último jogo</div>
          <div class="field">
            <label class="field-lbl">Data do jogo</label>
            <input class="field-in" type="date" id="r_data_${a.id}" value="${new Date().toISOString().slice(0,10)}">
          </div>
          <div class="field">
            <label class="field-lbl">Jornada / competição (opcional)</label>
            <input class="field-in" type="text" id="r_jornada_${a.id}" placeholder="Ex: Jornada 24">
          </div>
          <div class="field">
            <label class="field-lbl">Jogou?</label>
            <div class="opt-group" data-field="jogou" data-atleta="${a.id}">
              <div class="opt" data-val="sim">Sim</div>
              <div class="opt" data-val="suplente">Supl. s/ entrar</div>
              <div class="opt" data-val="nao">Não convocado</div>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label class="field-lbl">Minutos</label>
              <input class="field-in" type="number" min="0" max="120" id="r_min_${a.id}" placeholder="0">
            </div>
            <div class="field">
              <label class="field-lbl">Golos</label>
              <input class="field-in" type="number" min="0" max="20" id="r_golos_${a.id}" placeholder="0">
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label class="field-lbl">Assistências</label>
              <input class="field-in" type="number" min="0" max="20" id="r_assist_${a.id}" placeholder="0">
            </div>
            <div class="field">
              <label class="field-lbl">Cartões</label>
              <div class="opt-group" data-field="cartao" data-atleta="${a.id}">
                <div class="opt sel" data-val="nenhum">—</div>
                <div class="opt" data-val="amarelo">🟨</div>
                <div class="opt" data-val="vermelho">🟥</div>
              </div>
            </div>
          </div>
          <div class="field">
            <label class="field-lbl">Resultado da equipa</label>
            <div class="opt-group" data-field="resultado" data-atleta="${a.id}">
              <div class="opt" data-val="vitoria">Vitória</div>
              <div class="opt" data-val="empate">Empate</div>
              <div class="opt" data-val="derrota">Derrota</div>
            </div>
          </div>
          <div class="field">
            <label class="field-lbl">Actuação (opcional)</label>
            <div class="opt-group" data-field="actuacao" data-atleta="${a.id}">
              <div class="opt" data-val="excelente">Excelente</div>
              <div class="opt" data-val="boa">Boa</div>
              <div class="opt" data-val="ok">OK</div>
              <div class="opt" data-val="fraca">Fraca</div>
            </div>
          </div>
          <div class="field">
            <label class="field-lbl">Observações (opcional)</label>
            <input class="field-in" type="text" id="r_obs_${a.id}" placeholder="Nota rápida sobre o jogo">
          </div>
          <button class="save-btn" id="r_btn_${a.id}" onclick="submeterReport('${a.id}')">📨 Submeter Report</button>
          <p style="font-size:10px;color:var(--muted);margin-top:8px;line-height:1.5">Os minutos, golos e assistências somam automaticamente aos totais da época.</p>
        </div>

        <!-- PANEL TOTAIS -->
        <div class="panel" id="panel-totais-${a.id}">
          <div class="panel-title">✏️ Corrigir totais da época</div>
          <p style="font-size:11px;color:var(--muted);margin-bottom:12px;line-height:1.5">Usa só se algum valor estiver errado. Normalmente os totais actualizam-se sozinhos via reports de jogo.</p>
          <div class="field-row">
            <div class="field">
              <label class="field-lbl">Jogos</label>
              <input class="field-in" type="number" min="0" id="t_jogos_${a.id}" value="${s ? (s.jogos||0) : 0}">
            </div>
            <div class="field">
              <label class="field-lbl">Minutos</label>
              <input class="field-in" type="number" min="0" id="t_min_${a.id}" value="${s ? (s.minutos||0) : 0}">
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label class="field-lbl">Golos</label>
              <input class="field-in" type="number" min="0" id="t_golos_${a.id}" value="${s ? (s.golos||0) : 0}">
            </div>
            <div class="field">
              <label class="field-lbl">Assistências</label>
              <input class="field-in" type="number" min="0" id="t_assist_${a.id}" value="${s ? (s.assistencias||0) : 0}">
            </div>
          </div>
          <button class="save-btn" id="t_btn_${a.id}" onclick="guardarTotais('${a.id}')">💾 Guardar Totais</button>
        </div>

        ${reports.length ? `
          <div class="sec-label">📜 Jogos reportados (${reports.length})</div>
          <div class="history">
            ${reports.slice(0,5).map(r => `
              <div class="hist-item">
                <div>
                  <div class="hist-date">${new Date(r.data_jogo).toLocaleDateString('pt-PT')}</div>
                  <div class="hist-detail">${r.jornada ? escapeHtml(r.jornada) + ' · ' : ''}${r.jogou === 'sim' ? r.minutos + 'min' : (r.jogou === 'suplente' ? 'Suplente' : 'Não convocado')}</div>
                </div>
                <div class="hist-detail" style="text-align:right">
                  ${r.golos ? '⚽'.repeat(Math.min(r.golos,3)) + ' ' : ''}${r.assistencias ? '🅰️' + r.assistencias : ''}
                  ${r.cartao === 'amarelo' ? ' 🟨' : r.cartao === 'vermelho' ? ' 🟥' : ''}
                </div>
              </div>
            `).join('')}
          </div>
        ` : ''}
      </div>
    </div>
  `;
}

function togglePanel(atletaId, tipo){
  const target = document.getElementById('panel-' + tipo + '-' + atletaId);
  const other = document.getElementById('panel-' + (tipo === 'report' ? 'totais' : 'report') + '-' + atletaId);
  if(other) other.classList.remove('open');
  target.classList.toggle('open');
}

// selector de opções (chips)
document.addEventListener('click', e => {
  const opt = e.target.closest('.opt');
  if(!opt) return;
  const group = opt.closest('.opt-group');
  if(!group) return;
  group.querySelectorAll('.opt').forEach(o => o.classList.remove('sel'));
  opt.classList.add('sel');
  const atletaId = group.dataset.atleta;
  const field = group.dataset.field;
  if(!formState[atletaId]) formState[atletaId] = {};
  formState[atletaId][field] = opt.dataset.val;
});

async function submeterReport(atletaId){
  const fs = formState[atletaId] || {};
  const get = id => document.getElementById(id + atletaId).value.trim();
  const num = id => { const v = parseInt(document.getElementById(id + atletaId).value); return isNaN(v) ? 0 : v; };

  const dataJogo = get('r_data_');
  if(!dataJogo){ toast('Indica a data do jogo', true); return; }
  if(!fs.jogou){ toast('Indica se o atleta jogou', true); return; }

  const jogou = fs.jogou;
  const minutos = jogou === 'sim' ? num('r_min_') : 0;
  const golos = jogou === 'sim' ? num('r_golos_') : 0;
  const assists = jogou === 'sim' ? num('r_assist_') : 0;

  const btn = document.getElementById('r_btn_' + atletaId);
  btn.disabled = true; btn.textContent = 'A submeter...';

  try {
    // 1. inserir match report
    const { error: eRep } = await supa.from('atletas_360_match_reports').insert({
      atleta_id: atletaId,
      colaborador_id: colaborador.id,
      data_jogo: dataJogo,
      jornada: get('r_jornada_') || null,
      jogou: jogou,
      minutos: minutos,
      golos: golos,
      assistencias: assists,
      cartao: fs.cartao || 'nenhum',
      resultado_equipa: fs.resultado || null,
      actuacao: fs.actuacao || null,
      observacoes: get('r_obs_') || null,
      reportado_por_tipo: colaborador.tipo
    });
    if(eRep) throw eRep;

    // 2. somar aos totais da epoca
    const sAtual = statsMap[atletaId];
    if(sAtual){
      const novo = {
        jogos: (sAtual.jogos||0) + (jogou === 'nao' ? 0 : 1),
        jogos_titular: (sAtual.jogos_titular||0) + (jogou === 'sim' ? 1 : 0),
        minutos: (sAtual.minutos||0) + minutos,
        golos: (sAtual.golos||0) + golos,
        assistencias: (sAtual.assistencias||0) + assists
      };
      const { error: eUp } = await supa.from('atletas_360_stats')
        .update(novo).eq('id', sAtual.id);
      if(eUp) throw eUp;
      Object.assign(sAtual, novo);
    } else {
      const atleta = atletas.find(a => a.id === atletaId);
      const { data: sNovo, error: eIns } = await supa.from('atletas_360_stats').insert({
        atleta_id: atletaId, epoca: '2025/26',
        jogos: jogou === 'nao' ? 0 : 1,
        jogos_titular: jogou === 'sim' ? 1 : 0,
        minutos: minutos, golos: golos, assistencias: assists,
        clube: atleta.clube_actual, escalao: atleta.escalao,
        associacao: atleta.associacao, fonte_dados: 'colaborador'
      }).select().single();
      if(eIns) throw eIns;
      statsMap[atletaId] = sNovo;
    }

    // 3. marcar stats actualizadas
    await supa.from('atletas_360').update({ stats_actualizadas_em: new Date().toISOString() }).eq('id', atletaId);

    toast('✅ Jogo reportado! Totais actualizados.');
    setTimeout(() => location.reload(), 1200);

  } catch(err){
    console.error(err);
    toast('Erro: ' + (err.message || 'tenta de novo'), true);
    btn.disabled = false; btn.textContent = '📨 Submeter Report';
  }
}

async function guardarTotais(atletaId){
  const num = id => { const v = parseInt(document.getElementById(id + atletaId).value); return isNaN(v) ? 0 : v; };

  const btn = document.getElementById('t_btn_' + atletaId);
  btn.disabled = true; btn.textContent = 'A guardar...';

  try {
    const dados = {
      jogos: num('t_jogos_'),
      minutos: num('t_min_'),
      golos: num('t_golos_'),
      assistencias: num('t_assist_')
    };

    const sAtual = statsMap[atletaId];
    if(sAtual){
      const { error } = await supa.from('atletas_360_stats').update(dados).eq('id', sAtual.id);
      if(error) throw error;
    } else {
      const atleta = atletas.find(a => a.id === atletaId);
      const { error } = await supa.from('atletas_360_stats').insert({
        atleta_id: atletaId, epoca: '2025/26', ...dados,
        clube: atleta.clube_actual, escalao: atleta.escalao,
        associacao: atleta.associacao, fonte_dados: 'colaborador'
      });
      if(error) throw error;
    }

    await supa.from('atletas_360').update({ stats_actualizadas_em: new Date().toISOString() }).eq('id', atletaId);

    toast('💾 Totais guardados!');
    setTimeout(() => location.reload(), 1200);

  } catch(err){
    console.error(err);
    toast('Erro: ' + (err.message || 'tenta de novo'), true);
    btn.disabled = false; btn.textContent = '💾 Guardar Totais';
  }
}

init();
</script>
