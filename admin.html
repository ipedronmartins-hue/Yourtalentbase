<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin YTB</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:#080C08;color:#fff;padding:16px;max-width:600px;margin:0 auto}
.login{max-width:320px;margin:80px auto;background:#0F1410;border:1px solid #1F2520;border-radius:12px;padding:24px}
h2{font-size:22px;margin-bottom:16px;color:#D4AF37}.input{width:100%;background:#161D17;border:1px solid #1F2520;border-radius:8px;padding:11px;font-size:14px;color:#fff;margin-bottom:12px}
.btn{width:100%;background:#D4AF37;color:#000;border:none;padding:13px;border-radius:8px;font-size:14px;font-weight:800;cursor:pointer}
.btn-sm{padding:7px 12px;font-size:11px;width:auto;border-radius:7px;font-weight:700;border:none;cursor:pointer;margin-right:6px;margin-top:4px}
.ok{background:#00D46A;color:#000}.danger{background:rgba(255,80,80,.2);color:#ff8080;border:1px solid rgba(255,80,80,.3)}
.card{background:#0F1410;border:1px solid #1F2520;border-radius:10px;padding:14px;margin-bottom:8px}
.tag{font-size:9px;font-weight:800;padding:3px 8px;border-radius:100px;margin-right:4px}
.tp{background:rgba(255,165,0,.2);color:orange}.ta{background:rgba(0,212,106,.2);color:#00D46A}.tg{background:rgba(212,175,55,.2);color:#D4AF37}
#main{display:none}.tabs{display:flex;gap:4px;margin-bottom:12px}.tab{flex:1;background:#0F1410;border:1px solid #1F2520;border-radius:7px;padding:10px;font-size:12px;font-weight:700;cursor:pointer;color:#aaa}
.tab.active{background:#D4AF37;color:#000;border-color:#D4AF37}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.stat{background:#0F1410;border:1px solid #1F2520;border-radius:8px;padding:10px;text-align:center}
.stat-n{font-size:28px;font-weight:900;color:#D4AF37}.stat-l{font-size:9px;color:#aaa;text-transform:uppercase;letter-spacing:1px}
.empty{text-align:center;padding:40px;color:#666}.err{color:#ff8080;font-size:12px;margin-bottom:8px;display:none}</style></head>
<body>
<div id="login-view"><div class="login"><h2>Admin YTB</h2><div class="err" id="err">Password errada.</div>
<input class="input" id="pass" type="password" placeholder="Password">
<button class="btn" onclick="login()">Entrar</button></div></div>
<div id="main">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
<h2 style="font-size:26px;color:#fff">Admin <span style="color:#D4AF37">YTB</span></h2>
<button onclick="logout()" style="background:none;border:none;color:#aaa;cursor:pointer;font-size:12px">Sair</button></div>
<div class="stats"><div class="stat"><div class="stat-n" id="sP">-</div><div class="stat-l">Pendentes</div></div>
<div class="stat"><div class="stat-n" id="sA">-</div><div class="stat-l">Activos</div></div>
<div class="stat"><div class="stat-n" id="sV">-</div><div class="stat-l">Visíveis</div></div></div>
<div class="tabs"><button class="tab active" id="tI" onclick="tab('i')">Inscrições</button><button class="tab" id="tA" onclick="tab('a')">Atletas</button></div>
<div id="pI"></div><div id="pA" style="display:none"></div></div>
<script>
const P='YTB#Admin2026';
const U='https://nhshnplaiolxwcfuijfo.supabase.co';
const K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oc2hucGxhaW9seHdjZnVpamZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4NDQxNTAsImV4cCI6MjA4OTQyMDE1MH0.uyZiDun8495sjnHA6Wsk-Hou-3lubbNJfQqSYbMLSek';
const db=window.supabase.createClient(U,K);
function login(){
  if(document.getElementById('pass').value!==P){document.getElementById('err').style.display='block';return;}
  sessionStorage.setItem('ya','1');show();
}
function logout(){sessionStorage.removeItem('ya');location.reload();}
function show(){document.getElementById('login-view').style.display='none';document.getElementById('main').style.display='block';load();}
if(sessionStorage.getItem('ya')==='1')show();
document.getElementById('pass')?.addEventListener('keypress',e=>{if(e.key==='Enter')login();});
let cTab='i';
function tab(t){cTab=t;document.getElementById('tI').className='tab'+(t==='i'?' active':'');document.getElementById('tA').className='tab'+(t==='a'?' active':'');
document.getElementById('pI').style.display=t==='i'?'block':'none';document.getElementById('pA').style.display=t==='a'?'block':'none';}
async function load(){
  const[{data:ins},{data:atl}]=await Promise.all([db.from('inscricoes').select('*').order('created_at',{ascending:false}),db.from('atletas').select('*').order('created_at',{ascending:false})]);
  const il=ins||[];const al=atl||[];
  document.getElementById('sP').textContent=il.filter(x=>x.estado==='pendente').length;
  document.getElementById('sA').textContent=il.filter(x=>x.estado==='activo').length;
  document.getElementById('sV').textContent=al.filter(x=>x.visivel_publico).length;
  const pI=document.getElementById('pI');
  if(!il.length){pI.innerHTML='<div class="empty">Sem inscrições.</div>';}
  else pI.innerHTML=il.map(i=>{
    const dt=new Date(i.created_at).toLocaleDateString('pt-PT');
    const tel=(i.encarregado_telefone||'').replace(/[^0-9]/g,'');
    return`<div class="card"><span class="tag tp">${i.estado}</span><span class="tag tg">${i.plano==='com_visibilidade'?'14,90€':'9,90€'}</span>
    <div style="font-size:14px;font-weight:700;margin:6px 0">${i.atleta_nome}</div>
    <div style="font-size:11px;color:#aaa;margin-bottom:8px">${i.atleta_posicao||'?'} · ${i.atleta_clube||'?'} · ${i.atleta_escalao||'?'}<br>
    👤 ${i.encarregado_nome} · ${i.encarregado_email}${i.encarregado_telefone?' · '+i.encarregado_telefone:''}<br>${i.atleta_zerozero?`🔗 <a href="${i.atleta_zerozero}" target="_blank" style="color:#D4AF37">ZeroZero</a><br>`:''}🕐 ${dt}</div>
    ${i.estado==='pendente'?`<button class="btn-sm ok" onclick="upd('${i.id}','pago')">✓ Pago</button>`:''}
    ${i.estado==='pago'?`<button class="btn-sm ok" onclick="ativar('${i.id}')">⚡ Ativar</button>`:''}
    ${i.estado!=='activo'&&i.estado!=='recusado'?`<button class="btn-sm danger" onclick="upd('${i.id}','recusado')">✗ Recusar</button>`:''}
    ${tel?`<a class="btn-sm" href="https://wa.me/351${tel}" target="_blank" style="background:rgba(37,211,102,.2);color:#25D366;text-decoration:none;display:inline-block">📱 WA</a>`:''}
    </div>`;}).join('');
  const pA=document.getElementById('pA');
  if(!al.length){pA.innerHTML='<div class="empty">Sem atletas.</div>';}
  else pA.innerHTML=al.map(a=>`<div class="card">
    <span class="tag ${a.visivel_publico?'ta':'tp'}">${a.visivel_publico?'Visível':'Oculto'}</span>
    <div style="font-size:14px;font-weight:700;margin:6px 0">${a.nome_curto||a.nome}</div>
    <div style="font-size:11px;color:#aaa;margin-bottom:8px">${a.posicao_principal||'?'} · ${a.clube_actual||'?'} · ${a.escalao_actual||'?'}</div>
    <button class="btn-sm ${a.visivel_publico?'danger':'ok'}" onclick="vis('${a.id}',${!a.visivel_publico})">${a.visivel_publico?'Ocultar':'Tornar Visível'}</button>
    </div>`).join('');
}
async function upd(id,estado){await db.from('inscricoes').update({estado}).eq('id',id);load();}
async function ativar(id){
  const{data:i}=await db.from('inscricoes').select('*').eq('id',id).single();
  if(!i)return;
  const{error}=await db.from('atletas').insert({nome:i.atleta_nome,nome_curto:i.atleta_nome.split(' ')[0],posicao_principal:i.atleta_posicao,pe_dominante:i.atleta_pe,clube_actual:i.atleta_clube,escalao_actual:i.atleta_escalao,zerozero_url:i.atleta_zerozero,plano:i.plano,visivel_publico:i.plano==='com_visibilidade'||i.plano==='visibilidade'});
  if(error){alert('Erro: '+error.message);return;}
  await db.from('inscricoes').update({estado:'activo'}).eq('id',id);load();
}
async function vis(id,v){await db.from('atletas').update({visivel_publico:v}).eq('id',id);load();}
</script></body></html>
