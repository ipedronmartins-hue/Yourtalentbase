<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YTB Clube · Gestão</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/ytb-vivo.css">
<script src="/assets/js/ytb-vivo.js"></script>
<script src="/assets/js/ytb-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="ytb-tokens.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--white);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh}
body{max-width:560px;margin:0 auto;padding-bottom:60px}
.nav{position:sticky;top:0;z-index:100;background:rgba(8,12,8,.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:13px 18px;display:flex;align-items:center;justify-content:space-between}
.nav-title{font-family:'Barlow Condensed';font-weight:900;font-size:18px;letter-spacing:.3px}
.nav-title span{color:var(--gold)}
.nav-logout{font-size:11px;color:var(--red);cursor:pointer;background:none;border:none;font-family:inherit;display:none}
.login-wrap{padding:50px 22px 0;text-align:center}
.login-icon{font-size:56px;margin-bottom:14px}
.login-title{font-family:'Barlow Condensed';font-weight:900;font-size:36px;line-height:1;letter-spacing:-1px;margin-bottom:6px}
.login-title span{color:var(--gold)}
.login-sub{font-size:13px;color:var(--slate);margin-bottom:24px}
.input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;color:var(--white);font-family:inherit;font-size:15px;margin-bottom:10px}
.btn{width:100%;background:var(--gold);border:none;border-radius:10px;padding:14px;color:#0A0D0A;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer}
.btn-sec{background:var(--bg2);color:var(--white);border:1px solid var(--border)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.h{font-family:'Barlow Condensed';font-weight:900;font-size:20px;margin-bottom:6px}
.h span{color:var(--gold)}
.s{font-size:13px;color:var(--slate);line-height:1.5;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin:14px 0;overflow-x:auto;padding:0 14px 2px}
.tab{flex:0 0 auto;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 16px;color:var(--slate);font-family:'Barlow Condensed';font-weight:900;font-size:14px;letter-spacing:.3px;cursor:pointer;white-space:nowrap}
.tab.on{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.content{padding:0 14px}
.sec{display:none}
.sec.on{display:block}
.label{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
.chip{background:var(--bg3);border:1px solid var(--border);border-radius:999px;padding:8px 14px;font-family:inherit;font-weight:700;font-size:13px;color:var(--slate);cursor:pointer;margin:0 6px 6px 0}
.chip.on{background:var(--gold-soft);border-color:var(--gold-border);color:var(--gold)}
.pill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.5px;padding:3px 8px;border-radius:6px;text-transform:uppercase}
.pill-verde{background:rgba(0,212,106,.15);color:var(--up)}
.pill-laranja{background:rgba(224,164,88,.15);color:var(--orange)}
.pill-vermelho{background:rgba(255,80,80,.15);color:var(--red)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:999;max-width:90%;text-align:center}
.toast.show{opacity:1}
/* trazidas do coachbase.html para o gerador de treino do Clube */
.err{color:var(--red);font-size:12px;text-align:center;margin-top:8px;display:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step{display:flex;align-items:center;gap:12px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:8px 10px}
.step button{width:44px;height:44px;border-radius:9px;border:1px solid var(--border);background:var(--bg2);color:#fff;font-size:20px;cursor:pointer}
.step .v{flex:1;text-align:center;font-family:'Barlow Condensed';font-weight:900;font-size:24px}
.bloco{border:1px solid var(--border);border-radius:11px;padding:13px;margin-bottom:9px;background:var(--bg3)}
.bloco .bt{font-family:'Barlow Condensed';font-weight:900;font-size:16px;color:var(--gold)}
.ex{border-top:1px solid var(--border);padding:9px 0}
.ex .en{font-weight:800;font-size:14px}
.ex .eo{font-size:12px;color:var(--up)}
.ex .ed{font-size:12.5px;color:var(--slate);line-height:1.5;margin-top:3px}
</style>
</head>
<body>
<div class="nav">
  <div class="nav-title">YTB <span>Clube</span></div>
  <button class="nav-logout" id="btn-logout">Sair</button>
</div>
<div id="login-view" class="login-wrap">
  <div class="login-icon">🏟️</div>
  <div class="login-title">YTB <span>Clube</span></div>
  <div class="login-sub">Equipas, plantel, jogos e convocatórias — tudo num só sítio.</div>
  <input class="input" id="login-email" type="email" placeholder="O teu email">
  <button class="btn" id="btn-enviar-link">Entrar →</button>
  <div class="s" id="login-msg" style="margin-top:12px"></div>
</div>
<div id="main" style="display:none">
  <div class="tabs" id="tabs-topo"></div>
  <div class="content">
    <div class="sec on" id="sec-equipas"></div>
    <div class="sec" id="sec-plantel"></div>
    <div class="sec" id="sec-jogos"></div>
    <div class="sec" id="sec-membros"></div>
    <div class="sec" id="sec-treinos"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>const CFG = window.YTB_CONFIG || {};
const USING_SB = !!(CFG.SUPABASE_URL && CFG.SUPABASE_KEY && window.supabase);
const supa = USING_SB ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'ytb-clube-auth',flowType:'pkce'}}) : null;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(msg){var t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(t.__tm);t.__tm=setTimeout(function(){t.classList.remove('show');},2800);}

var meuClube=null, minhasEquipas=[], equipaAtiva=null, atletasDoClube=[], plantelDaEquipa=[], jogosDaEquipa=[];

/* ══════ AUTENTICAÇÃO ══════ */
async function verificarSessao(){
  if(!USING_SB){ document.getElementById('login-msg').textContent='Sem ligação ao servidor.'; return; }
  const {data:{session}} = await supa.auth.getSession();
  if(session){ mostrarMain(); } else { document.getElementById('login-view').style.display='block'; }
}
document.getElementById('btn-enviar-link').onclick=async function(){
  var email=(document.getElementById('login-email').value||'').trim();
  if(!email){ toast('Escreve o teu email'); return; }
  document.getElementById('login-msg').textContent='A enviar...';
  const {error}=await supa.auth.signInWithOtp({email:email, options:{emailRedirectTo:window.location.href.split('#')[0].split('?')[0]}});
  document.getElementById('login-msg').textContent = error ? ('Erro: '+error.message) : 'Liga chegou ao teu email — pode abrir noutro separador.';
};
document.getElementById('btn-logout').onclick=async function(){ await supa.auth.signOut(); window.location.reload(); };
// deteção de sessão criada noutro separador (o link de acesso abre sempre um novo) —
// sem isto, quem fizer login por email nunca via o separador original mudar
window.addEventListener('storage', function(ev){ if(ev.key && ev.key.indexOf('ytb-clube-auth')>-1) verificarSessao(); });
if(supa) supa.auth.onAuthStateChange(function(){ verificarSessao(); });

async function mostrarMain(){
  document.getElementById('login-view').style.display='none';
  document.getElementById('main').style.display='block';
  document.getElementById('btn-logout').style.display='block';
  await carregarMeusClubes();
}

/* ══════ CLUBES E EQUIPAS ══════ */
async function carregarMeusClubes(){
  const {data:r}=await supa.rpc('ytb_meus_clubes');
  const lista=(r&&r.ok&&r.lista)||[];
  if(!lista.length){
    document.getElementById('sec-equipas').innerHTML='<div class="card"><div class="h">Sem acesso a nenhum <span>clube</span></div><div class="s">Pede ao administrador da YTB para te associar a um clube.</div></div>';
    montarTabsTopo();
    return;
  }
  meuClube=lista[0]; // um só clube por agora — escolher entre vários fica para quando for preciso
  await carregarEquipas();
}
async function carregarEquipas(){
  const {data:r}=await supa.rpc('ytb_clube_equipas_listar',{p_clube_id:meuClube.clube_id});
  minhasEquipas=(r&&r.ok&&r.lista)||[];
  if(!equipaAtiva && minhasEquipas.length) equipaAtiva=minhasEquipas[0];
  pintarEquipas();
  montarTabsTopo();
  if(equipaAtiva){ await Promise.all([carregarPlantel(), carregarJogos(), carregarAtletasDoClube()]); }
}
function pintarEquipas(){
  const box=document.getElementById('sec-equipas');
  var html='<div class="card"><div class="h">'+esc(meuClube.nome)+' <span>· '+esc(meuClube.papel)+'</span></div>';
  html += minhasEquipas.length ? '' : '<div class="s">Ainda sem equipas. Cria a primeira abaixo.</div>';
  html += '</div>';
  if(minhasEquipas.length){
    html += '<div class="card"><div class="label">Equipas</div>';
    html += minhasEquipas.map(function(e){
      return '<div class="chip'+(equipaAtiva&&equipaAtiva.id===e.id?' on':'')+'" onclick="selecionarEquipa(\''+e.id+'\')">'+esc(e.nome)+' · '+esc(e.epoca)+' <span style="opacity:.6">('+e.n_plantel+')</span></div>';
    }).join('');
    html += '</div>';
  }
  if(['admin','secretaria','team_manager'].indexOf(meuClube.papel)>=0){
    html += '<div class="card"><div class="h">Criar <span>equipa</span></div>'
      +'<label class="label">Nome</label><input class="input" id="eq-nome" placeholder="Ex: Sub-13">'
      +'<label class="label">Época</label><input class="input" id="eq-epoca" placeholder="Ex: 2026/27" value="2026/27">'
      +'<label class="label">Escalão</label><input class="input" id="eq-escalao" placeholder="Ex: Sub-13">'
      +'<button class="btn" onclick="criarEquipa()">Criar equipa →</button></div>';
  }
  box.innerHTML=html;
}
window.selecionarEquipa=async function(id){
  equipaAtiva=minhasEquipas.find(function(e){return e.id===id;});
  pintarEquipas();
  await Promise.all([carregarPlantel(), carregarJogos()]);
};
window.criarEquipa=async function(){
  var nome=(document.getElementById('eq-nome').value||'').trim();
  var epoca=(document.getElementById('eq-epoca').value||'').trim();
  var escalao=(document.getElementById('eq-escalao').value||'').trim()||null;
  if(!nome||!epoca){ toast('Falta o nome ou a época'); return; }
  const {data:r}=await supa.rpc('ytb_clube_equipa_criar',{p_clube_id:meuClube.clube_id,p_nome:nome,p_epoca:epoca,p_escalao:escalao});
  if(!r||!r.ok){ toast('⚠ Não foi possível: '+((r&&r.motivo)||'erro')); return; }
  toast('✓ Equipa criada'); await carregarEquipas();
};

/* ══════ PLANTEL ══════ */
async function carregarAtletasDoClube(){
  const {data:r}=await supa.rpc('ytb_clube_atletas_listar',{p_clube_id:meuClube.clube_id});
  atletasDoClube=(r&&r.ok&&r.lista)||[];
}
async function carregarPlantel(){
  if(!equipaAtiva) return;
  const {data:r}=await supa.rpc('ytb_clube_plantel_listar',{p_equipa_id:equipaAtiva.id});
  plantelDaEquipa=(r&&r.ok&&r.lista)||[];
  pintarPlantel();
}
function pintarPlantel(){
  const box=document.getElementById('sec-plantel');
  if(!equipaAtiva){ box.innerHTML='<div class="card"><div class="s">Escolhe uma equipa na aba Equipas primeiro.</div></div>'; return; }
  var html='<div class="card"><div class="h">Plantel <span>'+esc(equipaAtiva.nome)+'</span></div>';
  html += plantelDaEquipa.length ? plantelDaEquipa.map(function(p){
    return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)"><span>'+(p.numero?'<b style="color:var(--gold)">#'+p.numero+'</b> ':'')+esc(p.nome)+'</span><span style="color:var(--muted);font-size:12px">'+esc(p.posicao||'')+'</span></div>';
  }).join('') : '<div class="s">Ainda sem atletas nesta equipa.</div>';
  html += '</div>';
  var jaNoPlantel={}; plantelDaEquipa.forEach(function(p){jaNoPlantel[p.atleta_id]=true;});
  var disponiveis=atletasDoClube.filter(function(a){return !jaNoPlantel[a.id];});
  if(disponiveis.length && ['admin','secretaria','team_manager'].indexOf(meuClube.papel)>=0){
    html += '<div class="card"><div class="h">Adicionar <span>atleta</span></div>'
      +'<label class="label">Atleta</label><select class="input" id="pl-atleta">'
      +disponiveis.map(function(a){return '<option value="'+a.id+'">'+esc(a.nome)+' ('+esc(a.escalao||'')+')</option>';}).join('')
      +'</select>'
      +'<label class="label">Número <span style="font-weight:400;color:var(--muted)">(opcional)</span></label><input class="input" id="pl-numero" type="number" min="1" max="99">'
      +'<label class="label">Posição <span style="font-weight:400;color:var(--muted)">(opcional)</span></label><input class="input" id="pl-posicao" placeholder="Ex: Médio">'
      +'<button class="btn" onclick="adicionarAoPlantel()">Adicionar ao plantel →</button></div>';
  }
  box.innerHTML=html;
}
window.adicionarAoPlantel=async function(){
  var atletaId=document.getElementById('pl-atleta').value;
  var numero=document.getElementById('pl-numero').value||null;
  var posicao=(document.getElementById('pl-posicao').value||'').trim()||null;
  const {data:r}=await supa.rpc('ytb_clube_plantel_adicionar',{p_equipa_id:equipaAtiva.id,p_atleta_id:atletaId,p_numero:numero,p_posicao:posicao});
  if(!r||!r.ok){ toast('⚠ Não foi possível: '+((r&&r.motivo)||'erro')); return; }
  toast('✓ Adicionado ao plantel'); await carregarEquipas(); await carregarPlantel();
};

/* ══════ JOGOS E CONVOCATÓRIAS ══════ */
async function carregarJogos(){
  if(!equipaAtiva) return;
  const {data:r}=await supa.rpc('ytb_clube_jogos_listar',{p_equipa_id:equipaAtiva.id});
  jogosDaEquipa=(r&&r.ok&&r.lista)||[];
  pintarJogos();
}
function pintarJogos(){
  const box=document.getElementById('sec-jogos');
  if(!equipaAtiva){ box.innerHTML='<div class="card"><div class="s">Escolhe uma equipa na aba Equipas primeiro.</div></div>'; return; }
  var hoje=new Date().toISOString().slice(0,10);
  var podeGerir=['admin','secretaria','team_manager','treinador'].indexOf(meuClube.papel)>=0;
  var html='<div class="card"><div class="h">Jogos <span>'+esc(equipaAtiva.nome)+'</span></div>';
  html += jogosDaEquipa.length ? jogosDaEquipa.map(function(j){
    var jaPassou = j.data_jogo && j.data_jogo < hoje;
    return '<div style="padding:10px 0;border-bottom:1px solid var(--border)">'
      +'<div style="font-weight:800">'+esc(j.adversario||'Adversário')+'</div>'
      +'<div class="s" style="margin:2px 0">'+(j.data_jogo?esc(j.data_jogo):'sem data')+(j.casa_fora?(' · '+(j.casa_fora==='casa'?'em casa':'fora')):'')
      +(j.resultado?(' · <b style="color:var(--white)">'+esc(j.resultado)+'</b>'):'')+'</div>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">'
      +(j.convocatoria_id
        ? '<button class="btn btn-sec" style="flex:1;min-width:140px" onclick="verConvocatoria(\''+j.convocatoria_id+'\')">Ver convocatória →</button>'
        : '<button class="btn btn-sec" style="flex:1;min-width:140px" onclick="abrirCriarConvocatoria(\''+j.id+'\')">Convocar →</button>')
      +(podeGerir && jaPassou
        ? '<button class="btn btn-sec" style="flex:1;min-width:140px" onclick="abrirRegistarResultado(\''+j.id+'\',\''+esc(j.resultado||'')+'\')">'+(j.resultado?'Corrigir resultado':'Registar resultado')+' →</button>'
        : '')
      +'</div>'
      +'<div id="resultado-form-'+j.id+'"></div>'
      +'</div>';
  }).join('') : '<div class="s">Ainda sem jogos.</div>';
  html += '</div>';
  if(podeGerir){
    html += '<div class="card"><div class="h">Criar <span>jogo</span></div>'
      +'<label class="label">Adversário</label><input class="input" id="jg-adversario" placeholder="Ex: Rio Tinto">'
      +'<label class="label">Data</label><input class="input" id="jg-data" type="date">'
      +'<label class="label">Competição <span style="font-weight:400;color:var(--muted)">(opcional)</span></label><input class="input" id="jg-competicao" placeholder="Ex: Distrital">'
      +'<div class="chips" id="jg-casa-fora" style="display:flex;margin-bottom:10px"><button class="chip on" data-v="casa" onclick="chipCasaFora(this)">Em casa</button><button class="chip" data-v="fora" onclick="chipCasaFora(this)">Fora</button></div>'
      +'<button class="btn" onclick="criarJogo()">Criar jogo →</button></div>';
  }
  html += '<div id="convocatoria-area"></div>';
  box.innerHTML=html;
}
window.chipCasaFora=function(btn){
  document.querySelectorAll('#jg-casa-fora .chip').forEach(function(b){b.classList.toggle('on',b===btn);});
};
window.criarJogo=async function(){
  var adversario=(document.getElementById('jg-adversario').value||'').trim();
  var data=document.getElementById('jg-data').value||null;
  var competicao=(document.getElementById('jg-competicao').value||'').trim()||null;
  var casaFora=(document.querySelector('#jg-casa-fora .chip.on')||{}).dataset ? document.querySelector('#jg-casa-fora .chip.on').getAttribute('data-v') : 'casa';
  if(!adversario){ toast('Falta o adversário'); return; }
  const {data:r}=await supa.rpc('ytb_clube_jogo_criar',{p_equipa_id:equipaAtiva.id,p_adversario:adversario,p_data:data,p_competicao:competicao,p_casa_fora:casaFora});
  if(!r||!r.ok){ toast('⚠ Não foi possível: '+((r&&r.motivo)||'erro')); return; }
  toast('✓ Jogo criado'); await carregarJogos();
};
window.abrirCriarConvocatoria=function(jogoId){
  var area=document.getElementById('convocatoria-area');
  if(!plantelDaEquipa.length){ toast('A equipa ainda não tem plantel'); return; }
  area.innerHTML='<div class="card"><div class="h">Convocar <span>plantel</span></div>'
    +'<div id="conv-checks">'+plantelDaEquipa.map(function(p){
      return '<label style="display:flex;align-items:center;gap:8px;padding:6px 0"><input type="checkbox" checked value="'+p.atleta_id+'"> '+(p.numero?'#'+p.numero+' ':'')+esc(p.nome)+'</label>';
    }).join('')+'</div>'
    +'<button class="btn" onclick="confirmarConvocatoria(\''+jogoId+'\')">Confirmar convocatória →</button></div>';
  area.scrollIntoView({behavior:'smooth'});
};
window.confirmarConvocatoria=async function(jogoId){
  var ids=Array.prototype.slice.call(document.querySelectorAll('#conv-checks input:checked')).map(function(i){return i.value;});
  if(!ids.length){ toast('Escolhe pelo menos um atleta'); return; }
  const {data:r}=await supa.rpc('ytb_clube_convocatoria_criar',{p_jogo_id:jogoId,p_atletas:ids});
  if(!r||!r.ok){ toast('⚠ Não foi possível: '+((r&&r.motivo)||'erro')); return; }
  toast('✓ Convocatória criada — a família já pode responder no Passaporte');
  document.getElementById('convocatoria-area').innerHTML='';
  await carregarJogos();
};
window.verConvocatoria=async function(convId){
  const {data:r}=await supa.rpc('ytb_clube_convocatoria_estado',{p_convocatoria_id:convId});
  var area=document.getElementById('convocatoria-area');
  if(!r||!r.ok){ area.innerHTML='<div class="card"><div class="s">⚠ Não foi possível carregar.</div></div>'; return; }
  var lista=r.lista||[];
  var rotulo={convocado:['A aguardar','pill-laranja'],pendente:['A aguardar','pill-laranja'],aceite:['Confirmado','pill-verde'],recusado:['Não vai','pill-vermelho']};
  area.innerHTML='<div class="card"><div class="h">Estado da <span>convocatória</span></div>'
    +lista.map(function(x){
      var r2=rotulo[x.resposta]||['—','pill-laranja'];
      return '<div style="padding:8px 0;border-bottom:1px solid var(--border)">'
        +'<div style="display:flex;justify-content:space-between;align-items:center"><span>'+esc(x.nome)+'</span><span class="pill '+r2[1]+'">'+r2[0]+'</span></div>'
        +'<div style="display:flex;align-items:center;gap:8px;margin-top:6px">'

var PAPEIS_CLUBE=[['admin','Admin'],['secretaria','Secretaria'],['team_manager','Team Manager'],['treinador','Treinador'],['scout','Scout']];
var membrosDoClube=[];
async function carregarMembros(){
  const {data:r}=await supa.rpc('ytb_clube_membros_listar',{p_clube_id:meuClube.clube_id});
  membrosDoClube=(r&&r.ok&&r.lista)||[];

function pintarMembros(){
  const box=document.getElementById('sec-membros');
  var html='<div class="card"><div class="h">Membros <span>do clube</span></div>';
  html += membrosDoClube.length ? membrosDoClube.map(function(m){
    var rotulo=(PAPEIS_CLUBE.find(function(p){return p[0]===m.papel;})||[,m.papel])[1];
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">'
      +'<span>'+esc(m.email)+(m.equipa_nome?(' <span style="color:var(--muted);font-size:12px">· '+esc(m.equipa_nome)+'</span>'):'')+'</span>'
      +'<span style="display:flex;align-items:center;gap:8px"><span class="pill pill-verde">'+esc(rotulo)+'</span>'
      +'<button style="background:none;border:none;color:var(--red);cursor:pointer;font-size:16px" onclick="removerMembro(\''+esc(m.email)+'\',\''+m.papel+'\')" title="Remover">✕</button></span>'
      +'</div>';
  }).join('') : '<div class="s">Ainda sem outros membros — és o único a gerir este clube.</div>';
  html += '</div>';
  html += '<div class="card"><div class="h">Adicionar <span>membro</span></div>'
    +'<label class="label">Email</label><input class="input" id="mb-email" type="email" placeholder="email@exemplo.com">'
    +'<label class="label">Papel</label><select class="input" id="mb-papel">'
    +PAPEIS_CLUBE.map(function(p){return '<option value="'+p[0]+'">'+p[1]+'</option>';}).join('')
    +'</select>'
    +'<div class="s">Não precisa de ter conta ainda — o papel fica reservado a este email assim que entrar na YTB.</div>'
    +'<button class="btn" onclick="adicionarMembro()">Adicionar →</button></div>';
  box.innerHTML=html;
}
window.adicionarMembro=async function(){
  var email=(document.getElementById('mb-email').value||'').trim();
  var papel=document.getElementById('mb-papel').value;
  if(!email){ toast('Falta o email'); return; }
  const {data:r}=await supa.rpc('ytb_clube_membro_adicionar',{p_clube_id:meuClube.clube_id,p_email:email,p_papel:papel});
  if(!r||!r.ok){ toast('⚠ Não foi possível: '+((r&&r.motivo)||'erro')); return; }
  toast('✓ Membro adicionado'); document.getElementById('mb-email').value=''; await carregarMembros();
};
window.removerMembro=async function(email,papel){
  const {data:r}=await supa.rpc('ytb_clube_membro_remover',{p_clube_id:meuClube.clube_id,p_email:email,p_papel:papel});
  if(!r||!r.ok){

};

/* — motor determinístico: escolhe do banco, filtra equip/tier, evita
   repetir o que já saiu recentemente (histórico local, por navegador) — */
function equipOk(equipStr){
  var toks=(equipStr||'').toLowerCase(), chaves=['bolas','coletes','cones','balizas','escada','barreiras'];
  for(var i=0;i<chaves.length;i++){var k=chaves[i],sing=k.slice(0,-1);
    if((toks.indexOf(k)>-1||toks.indexOf(sing)>-1)&&SEL.material.indexOf(k)<0)return false;}
  return true;
}
function poolCategoria(cat,tier,sub,tatica){
  return (BANCO_EQUIPA[cat]||[]).filter(function(d){
    if(tier<d.tierMin||(d.tierMax!=null&&tier>d.tierMax))return false;
    if(!equipOk(d.equip))return false;
    if(sub&&d.sub!==sub)return false;
    if(cat==='movimentacao'&&tatica){if(d.tatica!=='geral'&&d.tatica!==tatica)return false;}
    return true;
  });
}
var LS_HIST='ytbCoachHistExercicios';
function historico(){try{return JSON.parse(localStorage.getItem(LS_HIST)||'[]');}catch(e){return[];}}
function exercicioPorId(id){
  var cats=Object.keys(BANCO_EQUIPA);
  for(var i=0;i<cats.length;i++){
    var achado=(BANCO_EQUIPA[cats[i]]||[]).find(function(d){return d.id===id;});
    if(achado)return achado;
  }
  return null;
}
function registarUso(ids){var h=historico();ids.forEach(function(id){h.push(id);});if(h.length>250)h=h.slice(-250);localStorage.setItem(LS_HIST,JSON.stringify(h));pintarRecentesLista();}
function escolher(lista,n){
  var h=historico();
  var pont=lista.map(function(d){var idx=h.lastIndexOf(d.id);return {d:d,score:idx<0?-1:idx};});
  pont.sort(function(a,b){return a.score-b.score;});
  return pont.slice(0,Math.max(0,n)).map(function(p){return p.d;});
}
function drillParaBloco(d){return {id:d.id,nome:d.nome,organizacao:d.org||'',instrucoes:(d.foco?d.foco+'. ':'')+(d.obs||''),tempo:d.min};}

// ficava demasiado curta. Cada bloco vazio cai num tipo de conteúdo
// realmente adequado à idade, com o nome do bloco ajustado com honestidade.
var SUBSTITUTOS={linha_defensiva:['rotina_seccao','geral'],reacao_perda:['tecnica','geral'],
  movimentacao:['tecnica','geral'],saida_bola:['tecnica','geral'],rotina_seccao:['tecnica','geral'],

function montarSessao(diaTag){
  var dia=DIA_PLANO[diaTag]||DIA_PLANO['MD-4'];
  var tier=tierDeEscalao(SEL.escalao);
  var usados=[], blocos=[];
  function semRepetirNaSessao(lista){return lista.filter(function(d){return usados.indexOf(d.id)<0;});}
  dia.blocos.forEach(function(spec){
    var tatica=SEL.formato==='fut11'?SEL.tatica:null;
    var pool=semRepetirNaSessao(poolCategoria(spec.cat,tier,spec.sub,tatica));
    if(!pool.length)pool=semRepetirNaSessao(poolCategoria(spec.cat,tier,null,null)); // relaxa sub/tática
    var nomeBloco=spec.nome, adaptado=false;
    if(!pool.length&&SUBSTITUTOS[spec.cat]){
      for(var s=0;s<SUBSTITUTOS[spec.cat].length&&!pool.length;s++){
        pool=semRepetirNaSessao(poolCategoria(SUBSTITUTOS[spec.cat][s],tier,null,null));
        if(pool.length)adaptado=true;
      }
    }
    // último recurso: já usámos tudo o que existe para este tier nesta
    // sessão — melhor repetir um exercício adequado do que deixar o
    // bloco vazio (só acontece em bancos muito pequenos, ex. Sub-10)
    if(!pool.length){
      pool=poolCategoria(spec.cat,tier,null,null);
      if(!pool.length&&SUBSTITUTOS[spec.cat]){
        SUBSTITUTOS[spec.cat].forEach(function(sc){if(!pool.length){pool=poolCategoria(sc,tier,null,null);if(pool.length)adaptado=true;}});
      }
    }
    if(!pool.length)return;
    if(adaptado)nomeBloco=spec.nome+' (adaptado à idade)';
    var escolhidos;
    if(spec.capMin){
      // bola parada: 1-2 exercícios que juntos não passem o limite (regra do fundador)
      escolhidos=escolher(pool,pool.length);
      var soma=0,fica=[];
      for(var i=0;i<escolhidos.length&&fica.length<2;i++){
        if(soma+escolhidos[i].min<=spec.capMin){fica.push(escolhidos[i]);soma+=escolhidos[i].min;}
      }
      escolhidos=fica.length?fica:[escolhidos[0]];
    } else {
      escolhidos=escolher(pool,spec.n||1);
    }
    if(!escolhidos.length)return;
    usados=usados.concat(escolhidos.map(function(d){return d.id;}));
    blocos.push({nome:nomeBloco,min:escolhidos.reduce(function(s,d){return s+d.min;},0),exercicios:escolhidos.map(drillParaBloco)});
  });
  registarUso(usados);
  var tCard=SEL.formato==='fut11'&&TATICAS[SEL.tatica]?' · '+TATICAS[SEL.tatica].label.split(' ·')[0]:'';
  return {titulo:dia.titulo+' · '+SEL.escalao+' ('+SEL.formato+tCard+')',blocos:blocos};
}

function chips(id,itens,get,set,multi){
  var box=document.getElementById(id);
  box.innerHTML=itens.map(function(it){var v=Array.isArray(it)?it[0]:it,l=Array.isArray(it)?it[1]:it;
    var on=multi?get().indexOf(v)>=0:get()===v;
    return '<button class="chip'+(on?' on':'')+'" data-v="'+esc(v)+'">'+esc(l)+'</button>';}).join('');
  box.querySelectorAll('.chip').forEach(function(b){b.addEventListener('click',function(){
    var v=b.getAttribute('data-v');
    if(multi){var a=get();var i=a.indexOf(v);if(i>=0)a.splice(i,1);else a.push(v);set(a);}else set(v);
    chips(id,itens,get,set,multi);
    if(id==='cv-fmt')desenharCampo();
    if(id==='pr-fmt'){if(window.PR)PR.reformatar();atualizarTatica();}
    if(id==='c-fmt')atualizarTatica();
  });});
}
function chipsTatica(id){
  var itens=Object.keys(TATICAS).map(function(k){return [k,TATICAS[k].label.split(' ·')[0]];});
  chips(id,itens,function(){return SEL.tatica},function(v){guardarTaticaEscolhida(v);pintarInfoTatica();if(window.PR)PR.reformatar();});
}
function pintarInfoTatica(){
  var box=document.getElementById('tatica-info');if(!box)return;
  var t=TATICAS[SEL.tatica];
  box.innerHTML=t?('<div style="font-size:12.5px;color:var(--slate);line-height:1.6"><b style="color:#fff">'+esc(t.label)+'</b> — '+esc(t.desc)
    +'<br>✔ <span style="color:var(--green)">'+esc(t.forte)+'</span><br>⚠ <span style="color:var(--orange)">'+esc(t.vulner)+'</span></div>'):'';
}
function atualizarTatica(){
  var mostra=SEL.formato==='fut11';
  ['tatica-wrap','pr-tatica-wrap'].forEach(function(id){var el=document.getElementById(id);if(el)el.hidden=!mostra;});
}
function montarSeletores(){
  chips('c-esc',ESCALOES,function(){return SEL.escalao},function(v){SEL.escalao=v});
  chips('c-fmt',[['fut7','Fut7'],['fut9','Fut9'],['fut11','Fut11']],function(){return SEL.formato},function(v){SEL.formato=v});
  chips('c-dur',[[60,'60′'],[75,'75′'],[90,'90′']].map(function(x){return [String(x[0]),x[1]]}),function(){return String(SEL.dur)},function(v){SEL.dur=parseInt(v)});
  chips('c-mat',MATERIAIS,function(){return SEL.material},function(a){SEL.material=a},true);
  chips('c-foco',FOCOS,function(){return SEL.foco},function(v){SEL.foco=v});
  // cv-fmt e pr-fmt pertencem à Convocatória e à Prancheta do CoachBase
  // original — não fazem parte desta fatia (só o gerador de treino),
  // por isso removidas aqui (chamá-las com elementos inexistentes
  // interrompia toda a execução seguinte com "Cannot set properties of null")
  chipsTatica('c-tatica');
  pintarInfoTatica();atualizarTatica();
}
function stepN(d){SEL.n=Math.max(4,Math.min(30,SEL.n+d));document.getElementById('v-n').textContent=SEL.n;}

/* ── IA (reservada ao painel Adversário — julgamento tático, não listas) ── */
function chamarIA(prompt,maxTokens){
  return fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:prompt,max_tokens:maxTokens||1400})})
    .then(function(r){if(!r.ok)throw new Error('API '+r.status);return r.json();})
    .then(function(j){var t='';(j.content||[]).forEach(function(c){if(c.type==='text')t+=c.text;});return t.trim();});
}
function parseJSON(t){t=t.replace(/^```json?/i,'').replace(/```$/,'').trim();var i=t.indexOf('{'),f=t.lastIndexOf('}');if(i<0||f<0)throw new Error('sem JSON');return JSON.parse(t.slice(i,f+1));}

var FAVORITOS_EXERCICIOS=[];
function carregarFavoritosExercicios(){
  return supa.rpc('ytb_coach_exercicios_favoritos_listar').then(function(r){
    FAVORITOS_EXERCICIOS=(r&&r.data)||[];
    pintarFavoritosLista();
    return FAVORITOS_EXERCICIOS;
  }).catch(function(){ pintarFavoritosLista(); return FAVORITOS_EXERCICIOS; });
}
function pintarFavoritosLista(){
  var box=document.getElementById('favoritos-lista'); if(!box)return;
  var itens=FAVORITOS_EXERCICIOS.map(exercicioPorId).filter(Boolean);
  if(!itens.length){ box.innerHTML='<div class="s">Ainda sem favoritos — marca uma estrela numa sessão gerada.</div>'; return; }
  box.innerHTML=itens.map(function(d){
    return '<div class="ex"><div class="en">'+esc(d.nome)+' <span onclick="toggleFavoritoExercicio(\''+d.id+'\')" style="cursor:pointer;color:var(--gold);font-size:14px">★</span></div>'
      +(d.org?'<div class="eo">📐 '+esc(d.org)+'</div>':'')+'</div>';
  }).join('');
}
function pintarRecentesLista(){
  var box=document.getElementById('recentes-lista'); if(!box)return;
  var h=historico().slice().reverse();   // mais recente primeiro
  var vistos={}, ids=[];
  h.forEach(function(id){ if(!vistos[id] && ids.length<8){ vistos[id]=true; ids.push(id); } });
  var itens=ids.map(exercicioPorId).filter(Boolean);
  if(!itens.length){ box.innerHTML='<div class="s">Ainda sem exercícios usados nesta conta.</div>'; return; }
  box.innerHTML=itens.map(function(d){
    return '<div class="ex"><div class="en">'+esc(d.nome)+'</div>'+(d.org?'<div class="eo">📐 '+esc(d.org)+'</div>':'')+'</div>';
  }).join('');
}
function toggleFavoritoExercicio(id){
  var eraFav=FAVORITOS_EXERCICIOS.indexOf(id)>=0;
  supa.rpc('ytb_coach_exercicio_favoritar',{p_exercicio_id:id,p_favorito:!eraFav}).then(function(r){
    var d=r&&r.data;
    if(r.error||!d||!d.ok){ toast('⚠ Não foi possível guardar'); return; }
    if(eraFav){ var i=FAVORITOS_EXERCICIOS.indexOf(id); if(i>=0)FAVORITOS_EXERCICIOS.splice(i,1); }
    else FAVORITOS_EXERCICIOS.push(id);
    pintarFavoritosLista();
    if(ultimaSessao) renderSessao(ultimaSessao,'sessao-out');   // repinta as estrelas visíveis na sessão gerada, se houver
  }).catch(function(){ toast('⚠ Sem ligação'); });
}
function renderSessao(plano,mount){
  var total=(plano.blocos||[]).reduce(function(s,b){return s+(b.min||0);},0);
  var h='<div class="card"><div class="h">'+esc(plano.titulo||'Sessão')+'</div>'
    +'<div class="s">'+SEL.escalao+' · '+SEL.formato+' · '+SEL.n+' atletas · '+total+' min · 📚 banco CoachBase</div>';
  (plano.blocos||[]).forEach(function(b){
    h+='<div class="bloco"><div class="bt">'+esc(b.nome)+' <span style="color:var(--slate);font-size:12px">· '+(b.min||0)+' min</span></div>';
    (b.exercicios||[]).forEach(function(e){
      var fav = e.id && FAVORITOS_EXERCICIOS.indexOf(e.id)>=0;
      h+='<div class="ex"><div class="en">'+esc(e.nome)
        +(e.id?' <span onclick="toggleFavoritoExercicio(\''+e.id+'\')" style="cursor:pointer;color:'+(fav?'var(--gold)':'var(--muted)')+';font-size:14px">'+(fav?'★':'☆')+'</span>':'')
        +'</div>'
        +(e.organizacao?'<div class="eo">📐 '+esc(e.organizacao)+'</div>':'')
        +(e.instrucoes?'<div class="ed">'+esc(e.instrucoes)+'</div>':'')+'</div>';
    });
    h+='</div>';
  });
  h+='<div style="display:flex;gap:8px;margin-top:6px"><button class="btn" style="flex:1" onclick="guardarSessao()">💾 Guardar</button><button class="btn btn-sec" style="flex:1" onclick="window.print()">🖨 Imprimir</button></div></div>';
  document.getElementById(mount).innerHTML=h;
}
var ultimaSessao=null;
function gerarSessao(){
  var b=document.getElementById('btn-gerar');b.disabled=true;b.innerHTML='<span class="spinner"></span> A montar a sessão…';
  setTimeout(function(){
    ultimaSessao=montarSessao('MD-4');
    renderSessao(ultimaSessao,'sessao-out');
    b.disabled=false;b.textContent='📚 Gerar sessão do banco';
  },150); // respiro visual — a montagem é instantânea, não há chamada de rede
}
function guardarSessao(){
  if(!ultimaSessao){toast('Gera primeiro uma sessão');return;}
  if(!equipaAtiva){toast('Escolhe uma equipa primeiro');return;}
  supa.rpc('ytb_clube_sessao_criar',{p_equipa_id:equipaAtiva.id,p_titulo:ultimaSessao.titulo||'Sessão',p_escalao:SEL.escalao,p_formato:SEL.formato,p_n_atletas:SEL.n,p_duracao:SEL.dur,p_material:SEL.material,p_foco:SEL.foco,p_plano:ultimaSessao})
    .then(function(r){var d=r.data;if(r.error||!d||!d.ok){toast('⚠ Não guardado ('+((d&&d.motivo)||'erro')+')');return;}toast('✓ Sessão guardada na equipa');});
}

/* ══════ microciclo, copiado do CoachBase (migração 144) ══════ */
function gerarMicro(){
  var b=document.getElementById('btn-micro');b.disabled=true;b.innerHTML='<span class="spinner"></span> A montar a semana…';
  setTimeout(function(){
    var dias=['MD-4','MD-2','MD-1'];
    var out=dias.map(function(d){return {plano:montarSessao(d),dia:d};});
    var h='';out.forEach(function(o){var tot=(o.plano.blocos||[]).reduce(function(s,x){return s+(x.min||0);},0);
      h+='<div class="card"><div class="h">'+esc(o.dia)+' · '+esc(o.plano.titulo||'')+'</div><div class="s">'+tot+' min · 📚 banco CoachBase</div>';
      (o.plano.blocos||[]).forEach(function(bl){h+='<div class="bloco"><div class="bt">'+esc(bl.nome)+' · '+(bl.min||0)+'′</div>';(bl.exercicios||[]).forEach(function(e){h+='<div class="ex"><div class="en">'+esc(e.nome)+'</div>'+(e.instrucoes?'<div class="ed">'+esc(e.instrucoes)+'</div>':'')+'</div>';});h+='</div>';});
      h+='</div>';});
    h+='<div class="card"><div class="s">As 3 sessões complementam-se: MD-4 constrói (físico + saída de bola + secção), MD-2 aperta (linha defensiva, reação à perda, movimentação), MD-1 afina (bolas paradas ≤10 min, revisão leve). O mesmo exercício não se repete duas semanas seguidas.</div><button class="btn" onclick="guardarMicro()">💾 Guardar as 3 sessões</button></div>';
    document.getElementById('micro-out').innerHTML=h;window.__micro=out;
    b.disabled=false;b.textContent='📚 Gerar microciclo (3 sessões)';
  },150);
}
function guardarMicro(){
  var out=window.__micro||[];if(!out.length)return;
  if(!equipaAtiva){toast('Escolhe uma equipa primeiro');return;}
  var i=0;
  function um(){
    if(i>=out.length){toast('Microciclo guardado na equipa ✓ ('+out.length+' sessões)');return;}
    supa.rpc('ytb_clube_sessao_criar',{p_equipa_id:equipaAtiva.id,p_titulo:out[i].dia+' · '+(out[i].plano.titulo||'Sessão'),p_escalao:SEL.escalao,p_formato:SEL.formato,p_n_atletas:SEL.n,p_duracao:SEL.dur,p_material:SEL.material,p_foco:SEL.foco,p_plano:out[i].plano})
      .then(function(){i++;um();});
  }
  um();
}


/* ══════ TREINOS (gerador de sessão — cópia adaptada do CoachBase) ══════ */
function pintarTreinos(){
  const box=document.getElementById('sec-treinos');
  if(!equipaAtiva){ box.innerHTML='<div class="card"><div class="s">Escolhe uma equipa na aba Equipas primeiro.</div></div>'; return; }
  box.innerHTML='<div class="card">'
    +'<div class="h">Gerar <span style="color:var(--gold)">sessão de treino</span></div>'
    +'<div class="s">A sessão sai do banco de 95 exercícios do CoachBase, filtrado por escalão competitivo, material e (em fut11) pela tática da equipa.</div>'
    +'<label class="label">Escalão</label><div class="chips" id="c-esc"></div>'
    +'<label class="label">Formato</label><div class="chips" id="c-fmt"></div>'
    +'<div id="tatica-wrap" hidden><label class="label">A nossa tática</label><div class="chips" id="c-tatica"></div><div id="tatica-info" style="margin:0 0 12px"></div></div>'
    +'<div class="grid2" style="margin-bottom:12px">'
    +'<div><label class="label">Nº de atletas</label><div class="step"><button onclick="stepN(-1)">−</button><div class="v" id="v-n">12</div><button onclick="stepN(1)">+</button></div></div>'
    +'<div><label class="label">Duração</label><div class="chips" id="c-dur" style="margin:0"></div></div>'
    +'</div>'
    +'<label class="label">Material disponível</label><div class="chips" id="c-mat"></div>'
    +'<label class="label">Foco da sessão</label><div class="chips" id="c-foco"></div>'
    +'<button class="btn" id="btn-gerar" onclick="gerarSessao()">📚 Gerar sessão do banco</button>'
    +'<div class="err" id="serr"></div></div>'
    +'<div id="sessao-out"></div>'
    +'<div class="card"><div class="h">Microciclo <span style="color:var(--gold)">da semana</span></div>'
    +'<div class="s">Três sessões que se complementam até ao jogo: MD-4 constrói, MD-2 aperta, MD-1 afina. Usa os mesmos seletores de cima.</div>'
    +'<button class="btn" id="btn-micro" onclick="gerarMicro()">📚 Gerar microciclo (3 sessões)</button></div>'
    +'<div id="micro-out"></div>'
    +'<div class="card"><div class="h">★ <span style="color:var(--gold)">Favoritos</span></div>'
    +'<div class="s">Marca uma estrela em qualquer exercício de uma sessão gerada — fica aqui, para não teres de o procurar outra vez.</div>'
    +'<div id="favoritos-lista"><div class="s">A carregar…</div></div></div>'
    +'<div class="card"><div class="h">🕘 Usados <span style="color:var(--gold)">recentemente</span></div>'
    +'<div id="recentes-lista"><div class="s">A carregar…</div></div></div>';
  montarSeletores();
  carregarFavoritosExercicios();
  pintarRecentesLista();
}

/* ══════ NAVEGAÇÃO ══════ */
var TABS=[['equipas','Equipas'],['plantel','Plantel'],['jogos','Jogos'],['treinos','Treinos']];
function montarTabsTopo(){
  var tabs=TABS.slice();
  if(meuClube && meuClube.papel==='admin') tabs.push(['membros','Membros']);
  document.getElementById('tabs-topo').innerHTML=tabs.map(function(t,i){
    return '<button class="tab'+(i===0?' on':'')+'" data-t="'+t[0]+'" onclick="tab(\''+t[0]+'\')">'+t[1]+'</button>';
  }).join('');
}
window.tab=function(t){
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-t')===t);});
  document.querySelectorAll('.sec').forEach(function(s){s.classList.toggle('on',s.id==='sec-'+t);});
  if(t==='membros') carregarMembros();
  if(t==='treinos') pintarTreinos();
};
verificarSessao();
</script></body>
