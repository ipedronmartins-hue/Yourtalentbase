<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080C08">
<title>Scouting360 · Descoberta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/ytb-vivo.css">
<script src="/assets/js/ytb-vivo.js"></script>
<script src="/assets/js/ytb-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="ytb.css">
<style>
  
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;padding-bottom:50px}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .wrap{max-width:540px;margin:0 auto;padding:0 16px}
  .top{position:sticky;top:0;z-index:20;background:#080C08F2;backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
  .top .wrap{display:flex;align-items:center;gap:10px;height:54px}
  .mono{font-family:'Barlow Condensed',sans-serif;font-weight:900;letter-spacing:.06em;font-size:18px;color:var(--gold)}
  .top .ttl{flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:16px}
  .lead{margin-top:16px}
  .lead .h{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.01em;line-height:1}
  .lead .s{font-size:12.5px;color:var(--slate);margin-top:5px}

  /* seletor de ordenação */
  .sorts{display:flex;gap:7px;overflow-x:auto;padding:14px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .sorts::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:var(--bg3);border:1px solid var(--border);color:var(--slate);border-radius:999px;padding:8px 14px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:12px;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:.15s}
  .chip:hover{color:var(--text);border-color:var(--border2)}
  .chip.on{color:var(--up);border-color:rgba(0,212,106,.4);background:rgba(0,212,106,.08)}

  /* cartão (padrão aprovado) */
  .card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:15px 16px 0;margin-bottom:13px;overflow:hidden;transition:border-color .2s,transform .2s}
  .card:hover{border-color:var(--border2);transform:translateY(-1px)}
  .head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px;min-height:20px}
  .rank{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:13px;color:var(--muted);letter-spacing:1px}
  .rank.top{color:var(--gold)}
  .seal{display:inline-flex;align-items:center;gap:5px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--gold);background:var(--gold-soft);border:1px solid var(--gold-border);border-radius:999px;padding:4px 9px;white-space:nowrap}
  .seal.unv{color:var(--slate);background:var(--bg4);border-color:var(--border2)}
  .who-row{display:flex;align-items:flex-start;gap:12px}
  .avatar{flex:0 0 auto;width:46px;height:46px;border-radius:50%;background:var(--bg4);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:16px;color:var(--slate)}
  .who{flex:1;min-width:0;padding-top:1px}
  .who .nm{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:19px;line-height:1.05;letter-spacing:.2px}
  .who .mt{font-size:12px;color:var(--slate);margin-top:3px}
  .who .mt .pos{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:11px;letter-spacing:.5px;color:var(--text);background:var(--bg4);border:1px solid var(--border2);border-radius:6px;padding:1px 7px;margin-right:6px}

  .spark{margin:12px 0 4px}
  svg.sp{display:block;width:100%;height:34px;overflow:visible}

  .mx{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:6px}
  .mt-cell{text-align:center;padding:7px 2px 9px;border-radius:8px}
  .mt-cell .v{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:21px;line-height:1}
  .mt-cell .l{font-size:9px;text-transform:uppercase;letter-spacing:.9px;color:var(--slate);margin-top:4px}
  .mt-cell.on{background:var(--bg3)}
  .mt-cell.on .v,.mt-cell.on .l{color:var(--up)}

  .proof{display:flex;align-items:center;gap:7px;margin:12px -16px 0;padding:11px 16px;border-top:1px solid var(--border);background:rgba(0,0,0,.18);font-size:12px;color:var(--slate);flex-wrap:wrap}
  .proof .mk{color:var(--up)}
  .proof b{font-family:'Barlow Condensed',sans-serif;font-weight:800;color:var(--text)}

  .foot{text-align:center;font-size:10.5px;color:var(--muted);margin-top:18px}
  .demo-tag{color:var(--gold);font-weight:700}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  .gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:22px}
  .gate-card{max-width:400px;width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:28px 24px;text-align:center}
  .gate-brand{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--slate);margin-bottom:18px}
  .gate-h{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:26px;margin-bottom:8px}
  .gate-s{font-size:13px;color:var(--slate);line-height:1.55;margin-bottom:20px}
  .gate-input{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:10px;padding:13px;color:var(--text);font-family:inherit;font-size:15px;margin-bottom:10px}
  .gate-input:focus{outline:none;border-color:var(--slate)}
  .gate-err{color:var(--down);font-size:12.5px;min-height:16px;margin-bottom:8px;display:none}
  .gate-btn{width:100%;background:var(--text);color:#0A0D0A;border:none;border-radius:10px;padding:13px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
  .gate-btn:disabled{opacity:.5}
  .gate-contact{margin-top:14px;font-size:12px;color:var(--muted)}
  .gate-contact a{color:var(--slate)}
  .gate-pend .big{font-size:40px;margin-bottom:10px}
  .gate-pend .t{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;margin-bottom:6px}
  .gate-pend .s{font-size:13px;color:var(--slate);line-height:1.55}
  .gate-spin{width:24px;height:24px;border:2px solid var(--border2);border-top-color:var(--text);border-radius:50%;animation:gsp .8s linear infinite;margin:8px auto}
  @keyframes gsp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div id="gate" class="gate">
    <div class="gate-card">
      <div class="gate-brand"><a class="mono" href="/" title="Início" aria-label="Início" style="text-decoration:none">YTB</a> · Área reservada</div>
      <div id="gate-form">
        <div class="gate-h">Scouting360</div>
        <div class="gate-s">Acesso a scouts e admin. Entras por link no email — sem password. O acesso abre quando confirmarmos o teu pagamento.</div>
        <input id="gate-email" class="gate-input" type="email" placeholder="o.teu@email.com" autocomplete="email">
        <div class="gate-err" id="gate-err"></div>
        <button id="gate-btn" class="gate-btn">Entrar →</button>
        <div class="gate-contact">És clube? <a id="wa-clube" href="#" target="_blank" rel="noopener">Pedir acesso por WhatsApp →</a></div>
      </div>
      <div id="gate-status"></div>
    </div>
  </div>
  <header class="top"><div class="wrap"><a class="mono" href="/" title="Início" aria-label="Início" style="text-decoration:none">YTB</a><span class="ttl">Scouting360</span></div></header>
  <main class="wrap">
    <div class="lead"><div class="h">Base de talento longitudinal</div><div class="s">Descoberta por trajetória — não por popularidade.</div></div>
    <div class="sorts" id="sorts"></div>
    <div id="list"></div>
    <div class="foot" id="foot"></div>
  </main>

<script>
(function(){
  "use strict";
  var CFG=window.YTB_CONFIG||{};
  var URL_=CFG.SUPABASE_URL||'',KEY=CFG.SUPABASE_KEY||'';
  var USING_SB=!!(URL_&&KEY&&window.supabase);
  var supa=USING_SB?window.supabase.createClient(URL_,KEY):null;

  // DEMO — 6 atletas com perfis variados (para a ordenação reordenar de verdade)
  var DEMO=[
    {nome:"Coutinho",posicao:"MC",escalao:"Sub-13",clube:"Gondomar SC",evolucao_pct:31,treinabilidade:87,compromisso:92,consistencia:89,nivel_verificacao:"Scout + Treinador",observadores:5,eventos:52,epocas:3,serie:[60,63,67,72,80,90]},
    {nome:"Rafa",posicao:"EE",escalao:"Sub-15",clube:"Boavista",evolucao_pct:44,treinabilidade:82,compromisso:88,consistencia:79,nivel_verificacao:"Scout",observadores:2,eventos:21,epocas:2,serie:[52,55,61,70,79,88]},
    {nome:"Diogo",posicao:"DC",escalao:"Sub-13",clube:"Dragon Force",evolucao_pct:12,treinabilidade:95,compromisso:80,consistencia:84,nivel_verificacao:"Scout + Treinador",observadores:4,eventos:38,epocas:2,serie:[84,86,85,88,90,95]},
    {nome:"Tomás",posicao:"GR",escalao:"Sub-11",clube:"Leixões",evolucao_pct:18,treinabilidade:78,compromisso:95,consistencia:92,nivel_verificacao:"Scout + Treinador",observadores:3,eventos:44,epocas:3,serie:[66,70,71,74,78,82]},
    {nome:"Martim",posicao:"PL",escalao:"Sub-13",clube:"Famalicão",evolucao_pct:27,treinabilidade:84,compromisso:76,consistencia:71,nivel_verificacao:"Scout",observadores:2,eventos:16,epocas:1,serie:[58,62,66,70,73,84]},
    {nome:"Afonso",posicao:"MDC",escalao:"Sub-15",clube:"Vitória SC",evolucao_pct:9,treinabilidade:88,compromisso:90,consistencia:94,nivel_verificacao:"Scout + Treinador",observadores:6,eventos:61,epocas:3,serie:[80,82,84,86,87,90]}
  ];

  function verifRank(a){return /trein/i.test(a.nivel_verificacao||'')?2:1;}
  var METRICS={
    evolucao:{label:"Evolução 24m", get:function(a){return a.evolucao_pct;}},
    treinabilidade:{label:"Treinabilidade", get:function(a){return a.treinabilidade;}},
    compromisso:{label:"Compromisso", get:function(a){return a.compromisso;}},
    consistencia:{label:"Consistência", get:function(a){return a.consistencia;}},
    observados:{label:"Mais observados", get:function(a){return a.observadores;}},
    verificados:{label:"Mais verificados", get:function(a){return verifRank(a)*1000+a.observadores;}},
    densidade:{label:"Densidade de dados", get:function(a){return a.eventos;}}
  };
  var ORDER=["evolucao","treinabilidade","compromisso","consistencia","observados","verificados","densidade"];
  var sortBy="evolucao", data=DEMO;

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function spark(serie){
    if(!serie||serie.length<2) return '';
    var w=480,h=34,n=serie.length;
    var pts=serie.map(function(v,i){return [+(i*(w/(n-1))).toFixed(1),+(h-(v/100)*(h*0.7)-h*0.15).toFixed(1)];});
    var line=pts.map(function(p,i){return (i?'L':'M')+p[0]+','+p[1];}).join(' ');
    var area=line+' L'+w+','+h+' L0,'+h+' Z';
    return '<div class="spark"><svg class="sp" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true">'+
      '<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00D46A" stop-opacity=".18"/><stop offset="1" stop-color="#00D46A" stop-opacity="0"/></linearGradient></defs>'+
      '<path d="'+area+'" fill="url(#sg)"/><path d="'+line+'" fill="none" stroke="#00D46A" stroke-width="2"/></svg></div>';
  }

  function pad(n){return n<10?'0'+n:''+n;}
  function initials(nm){var p=String(nm||'').trim().split(/\s+/);var s=((p[0]||'')[0]||'')+((p[1]||'')[0]||'');return s.toUpperCase()||'–';}
  function sealLbl(v){v=String(v||'').toLowerCase();if(/trein/.test(v))return 'Scout + Treinador';if(/scout/.test(v))return 'Scout';return 'Por verificar';}

  function render(){
    document.getElementById('sorts').innerHTML=ORDER.map(function(k){
      return '<button class="chip'+(k===sortBy?' on':'')+'" data-k="'+k+'">'+esc(METRICS[k].label)+'</button>';
    }).join('');
    document.querySelectorAll('.chip').forEach(function(b){b.addEventListener('click',function(){sortBy=b.dataset.k;load();});});

    var list=data.slice().sort(function(x,y){return (METRICS[sortBy].get(y)||-1e9)-(METRICS[sortBy].get(x)||-1e9);});
    var tiles=[["evolucao","Evolução"],["treinabilidade","Treinab"],["compromisso","Compromisso"],["consistencia","Consist"]];

    document.getElementById('list').innerHTML=list.map(function(a,i){
      var lbl=sealLbl(a.nivel_verificacao), unv=(lbl==='Por verificar');
      var mx=tiles.map(function(t){
        var key=t[0], on=(key===sortBy), val=a[key==='evolucao'?'evolucao_pct':key];
        var disp=(key==='evolucao')?(((val||0)>=0?'+':'')+(val||0)+'%'):(val==null?'—':val);
        return '<div class="mt-cell'+(on?' on':'')+'"><div class="v num">'+disp+'</div><div class="l">'+t[1]+'</div></div>';
      }).join('');
      return '<div class="card">'+
        '<div class="head">'+
          '<span class="rank'+(i<1?' top':'')+' num">'+pad(i+1)+'</span>'+
          '<span class="seal'+(unv?' unv':'')+'">✦ '+lbl+'</span>'+
        '</div>'+
        '<div class="who-row"><div class="avatar">'+initials(a.nome)+'</div>'+
          '<div class="who"><div class="nm">'+esc(a.nome)+'</div>'+
          '<div class="mt"><span class="pos">'+esc(a.posicao||'')+'</span>'+esc(a.escalao||'')+' · '+esc(a.clube||'')+'</div></div></div>'+
        spark(a.serie)+
        '<div class="mx">'+mx+'</div>'+
        '<div class="proof"><span class="mk">◇</span> <b class="num">'+(a.observadores||0)+'</b> observadores · <b class="num">'+(a.eventos||0)+'</b> eventos · <b class="num">'+(a.epocas||0)+'</b> '+((a.epocas||0)===1?'época':'épocas')+'</div>'+
        '</div>';
    }).join('');
    document.getElementById('foot').innerHTML=USING_SB?'YourTalentBase · Scouting360':'<span class="demo-tag">Demonstração</span> · 6 atletas de exemplo';
  }

  function load(){
    if(!USING_SB){ data=DEMO; render(); return; }
    supa.rpc('ytb_scouting360',{p_ordenar:sortBy,p_limit:50}).then(function(res){
      data=(res&&res.data&&res.data.length)?res.data:DEMO; render();
    }).catch(function(){ data=DEMO; render(); });
  }
  /* ════ PORTÃO DE ACESSO (magic link + estado aprovado) ════ */
  var ALLOW=['scout','admin'];
  function gq(id){return document.getElementById(id);}
  function gateMsg(h){var s=gq('gate-status');if(s)s.innerHTML=h;}
  function showApp(){var g=gq('gate');if(g)g.style.display='none';load();}
  function gateLogin(){
    var email=(gq('gate-email').value||'').trim().toLowerCase();
    var err=gq('gate-err');
    if(!email||email.indexOf('@')<0){err.style.display='block';err.textContent='Insere um email válido';return;}
    err.style.display='none';
    var btn=gq('gate-btn');btn.disabled=true;btn.textContent='A enviar...';
    supa.auth.signInWithOtp({email:email,options:{emailRedirectTo:location.href.split('#')[0].split('?')[0]}}).then(function(r){
      if(r.error){err.style.display='block';err.textContent='Não foi possível enviar o link.';btn.disabled=false;btn.textContent='Entrar →';return;}
      gq('gate-form').style.display='none';
      gateMsg('<div class="gate-pend"><div class="big">📧</div><div class="t">Verifica o teu email</div><div class="s">Enviámos um link para <b>'+esc(email)+'</b>. Abre e clica para entrares.</div></div>');
    });
  }
  function gateProcess(){
    supa.auth.getSession().then(function(res){
      var s=res&&res.data&&res.data.session; if(!s||!s.user)return;
      var email=s.user.email.toLowerCase();
      var f=gq('gate-form');if(f)f.style.display='none';
      gateMsg('<div class="gate-pend"><div class="gate-spin"></div><div class="t">A verificar acesso</div></div>');
      supa.from('perfis').select('nome,papel,estado').eq('email',email).maybeSingle().then(function(p){
        var perfil=p&&p.data;
        if(!perfil||perfil.estado!=='aprovado'||ALLOW.indexOf(perfil.papel)<0){
          gateMsg('<div class="gate-pend"><div class="big">🔒</div><div class="t">Acesso pendente</div><div class="s">A conta '+esc(email)+' ainda não tem acesso aprovado. Assim que confirmarmos o pagamento, entras.</div><button id="gate-out" class="gate-btn" style="margin-top:12px">Usar outro email</button></div>');
          var o=gq('gate-out');if(o)o.addEventListener('click',gateLogout);
          return;
        }
        showApp();
      });
    });
  }
  function gateLogout(){supa.auth.signOut().then(function(){location.reload();});}

  if(!USING_SB){ showApp(); }
  else {
    var wa=gq('wa-clube'); if(wa) wa.href='https://wa.me/351913695846?text='+encodeURIComponent('Olá! 👋 Represento um clube e quero acesso ao Scouting360 para descobrir atletas com dados. Podemos falar?');
    gq('gate-btn').addEventListener('click',gateLogin);
    gq('gate-email').addEventListener('keypress',function(e){if(e.key==='Enter')gateLogin();});
    gateProcess();
    supa.auth.onAuthStateChange(function(){gateProcess();});
  }
})();
</script>
</body>
</html>
