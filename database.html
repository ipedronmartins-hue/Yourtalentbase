<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base de Talentos · YourTalentBase</title>
<meta name="description" content="Base de dados de jovens talentos do futebol português. Filtra por escalão, posição, clube.">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080C08;--bg2:#0F1410;--bg3:#161D17;
  --gold:#D4AF37;--gold-soft:rgba(212,175,55,.15);--gold-border:rgba(212,175,55,.3);
  --green:#00D46A;--border:#1F2520;--white:#fff;--slate:#aaa;--muted:#666;
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--white);min-height:100vh;max-width:520px;margin:0 auto;padding-bottom:40px}

.nav{position:sticky;top:0;z-index:50;background:rgba(8,12,8,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-badge{width:32px;height:32px;background:var(--gold);border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:900;font-size:13px;color:#000}
.nav-name{font-family:'Barlow Condensed';font-weight:800;font-size:18px;letter-spacing:1.5px;color:#fff}
.nav-name span{color:var(--gold)}
.nav-back{font-size:12px;color:var(--slate);text-decoration:none}

.header{padding:24px 18px 16px;text-align:center}
.title{font-family:'Barlow Condensed';font-weight:900;font-size:34px;line-height:1;letter-spacing:-1px;margin-bottom:6px}
.title span{color:var(--gold)}
.sub{font-size:12px;color:var(--slate);margin-bottom:18px}

.search-wrap{padding:0 18px 14px}
.search-input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:14px;color:#fff;font-family:inherit;outline:none}
.search-input:focus{border-color:var(--gold)}

.filters{padding:0 18px 14px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{flex-shrink:0;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:11px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit}
.filter.active{background:var(--gold);color:#000;border-color:var(--gold)}

.count{padding:0 18px 14px;font-size:11px;color:var(--muted);letter-spacing:.5px}

.athletes-list{padding:0 18px;display:flex;flex-direction:column;gap:8px}
.athlete-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  padding:14px;display:flex;gap:14px;align-items:flex-start;cursor:pointer;
  transition:all .15s
}
.athlete-card:active{transform:scale(.99)}
.athlete-card.expanded{border-color:var(--gold-border);background:var(--bg3)}

.athlete-foto{width:64px;height:64px;border-radius:10px;background:var(--bg3);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:900;font-size:24px;color:var(--gold)}
.athlete-foto img{width:100%;height:100%;object-fit:cover}

.athlete-info{flex:1;min-width:0}
.athlete-nome{font-size:15px;font-weight:700;color:#fff;margin-bottom:2px;line-height:1.2}
.athlete-meta{font-size:11px;color:var(--slate);margin-bottom:4px;line-height:1.4}
.athlete-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:8px;font-weight:800;letter-spacing:1px;padding:3px 7px;border-radius:100px;text-transform:uppercase}
.tag-gold{background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold-border)}
.tag-grey{background:var(--bg3);color:var(--slate);border:1px solid var(--border)}

.athlete-chev{color:var(--muted);font-size:14px;transition:transform .2s;flex-shrink:0;margin-top:18px}
.athlete-card.expanded .athlete-chev{transform:rotate(90deg);color:var(--gold)}

.athlete-detail{display:none;padding:14px 0 0;margin-top:14px;border-top:1px solid var(--border);width:100%}
.athlete-card.expanded .athlete-detail{display:block;animation:fadeIn .2s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.detail-row{display:flex;justify-content:space-between;gap:14px;padding:6px 0;font-size:11px;border-bottom:1px solid rgba(255,255,255,.04)}
.detail-row:last-of-type{border-bottom:none}
.detail-label{color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;font-size:9px;flex-shrink:0;padding-top:2px}
.detail-value{color:#fff;text-align:right;font-weight:500;flex:1;line-height:1.4}
.palmares-list{margin-top:8px;font-size:11px;color:#fff;line-height:1.5}
.palmares-item{padding:3px 0;color:var(--slate)}
.palmares-item strong{color:var(--gold);font-weight:700;display:block;margin-bottom:2px}

.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:13px}
.loading{text-align:center;padding:40px;color:var(--muted)}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid rgba(212,175,55,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.cta-bottom{margin:30px 18px 0;padding:18px;background:linear-gradient(135deg,rgba(212,175,55,.08),rgba(0,0,0,.3));border:1px solid var(--gold-border);border-radius:12px;text-align:center}
.cta-bottom-title{font-family:'Barlow Condensed';font-weight:900;font-size:20px;color:#fff;margin-bottom:6px}
.cta-bottom-text{font-size:11px;color:var(--slate);margin-bottom:12px}
.cta-bottom-btn{display:inline-block;background:var(--gold);color:#000;padding:10px 18px;border-radius:8px;font-size:11px;font-weight:800;letter-spacing:.5px;text-decoration:none;text-transform:uppercase}
</style>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-logo">
    <div class="nav-badge">YT</div>
    <div class="nav-name">Your<span>Talent</span>Base</div>
  </a>
  <a href="/" class="nav-back">← Voltar</a>
</nav>

<div class="header">
  <div class="title">Base de <span>Talentos</span></div>
  <div class="sub">Jovens promessas do futebol português</div>
</div>

<div class="search-wrap">
  <input class="search-input" id="search" type="search" placeholder="🔍 Procurar nome ou clube...">
</div>

<div class="filters" id="filter-escalao">
  <div class="filter active" data-filter="all">Todos</div>
  <div class="filter" data-filter="Sub-9">Sub-9</div>
  <div class="filter" data-filter="Sub-10">Sub-10</div>
  <div class="filter" data-filter="Sub-11">Sub-11</div>
  <div class="filter" data-filter="Sub-12">Sub-12</div>
  <div class="filter" data-filter="Sub-13">Sub-13</div>
  <div class="filter" data-filter="Sub-14">Sub-14</div>
  <div class="filter" data-filter="Sub-15">Sub-15</div>
  <div class="filter" data-filter="Sub-17">Sub-17</div>
  <div class="filter" data-filter="Sub-19">Sub-19</div>
</div>

<div class="count" id="count">A carregar...</div>

<div id="loading" class="loading"><div class="spinner"></div></div>
<div id="athletes-list" class="athletes-list"></div>

<div class="cta-bottom">
  <div class="cta-bottom-title">Queres ver o teu filho aqui?</div>
  <div class="cta-bottom-text">Inscreve-o no plano com Visibilidade</div>
  <a href="inscrever.html" class="cta-bottom-btn">Inscrever →</a>
</div>

<script>
const SUPABASE_URL = 'https://nhshnplaiolxwcfuijfo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oc2hucGxhaW9seHdjZnVpamZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4NDQxNTAsImV4cCI6MjA4OTQyMDE1MH0.uyZiDun8495sjnHA6Wsk-Hou-3lubbNJfQqSYbMLSek';
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let allAtletas = [];
let filterEscalao = 'all';
let searchTerm = '';

function calcIdade(d) {
  if (!d) return null;
  const n = new Date(d), h = new Date();
  let i = h.getFullYear() - n.getFullYear();
  const m = h.getMonth() - n.getMonth();
  if (m < 0 || (m === 0 && h.getDate() < n.getDate())) i--;
  return i;
}

async function load() {
  const { data, error } = await supa
    .from('atletas')
    .select('*')
    .eq('visivel_publico', true)
    .order('created_at', { ascending: false });

  document.getElementById('loading').style.display = 'none';
  
  if (error) {
    console.error('Erro:', error);
    document.getElementById('athletes-list').innerHTML = '<div class="empty">Erro a carregar. Tenta novamente.</div>';
    return;
  }

  allAtletas = data || [];
  render();
}

function render() {
  let filtered = allAtletas;
  
  if (filterEscalao !== 'all') {
    filtered = filtered.filter(a => a.escalao_actual === filterEscalao);
  }
  
  if (searchTerm) {
    const term = searchTerm.toLowerCase();
    filtered = filtered.filter(a => 
      (a.nome || '').toLowerCase().includes(term) ||
      (a.nome_curto || '').toLowerCase().includes(term) ||
      (a.clube_actual || '').toLowerCase().includes(term)
    );
  }
  
  document.getElementById('count').textContent = `${filtered.length} ${filtered.length === 1 ? 'atleta' : 'atletas'}`;
  
  const list = document.getElementById('athletes-list');
  if (!filtered.length) {
    list.innerHTML = '<div class="empty">Nenhum atleta encontrado</div>';
    return;
  }
  
  list.innerHTML = filtered.map(a => {
    const idade = calcIdade(a.data_nascimento);
    const isYTB = a.plano === 'ytb_acompanhado';
    const palmares = a.palmares || [];
    const historico = a.historico_clubes || [];
    
    return `
      <div class="athlete-card" data-id="${a.id}">
        <div class="athlete-foto">
          ${a.foto_url ? `<img src="${a.foto_url}" alt="${a.nome_curto}">` : ((a.nome_curto || a.nome || '?')[0])}
        </div>
        <div class="athlete-info">
          <div class="athlete-nome">${a.nome_curto || a.nome}</div>
          <div class="athlete-meta">
            ${idade ? idade + ' anos · ' : ''}${a.posicao_principal || ''}
            <br>${a.clube_actual || ''} ${a.escalao_actual ? '· ' + a.escalao_actual : ''}
          </div>
          <div class="athlete-tags">
            ${a.posicao_principal ? `<span class="tag tag-grey">${a.posicao_principal}</span>` : ''}
            ${a.escalao_actual ? `<span class="tag tag-grey">${a.escalao_actual}</span>` : ''}
            ${isYTB ? '<span class="tag tag-gold">YTB</span>' : ''}
          </div>
          
          <div class="athlete-detail">
            ${a.nome !== a.nome_curto ? `<div class="detail-row"><span class="detail-label">Nome completo</span><span class="detail-value">${a.nome}</span></div>` : ''}
            ${a.pe_dominante ? `<div class="detail-row"><span class="detail-label">Pé dominante</span><span class="detail-value">${a.pe_dominante === 'D' ? 'Direito' : a.pe_dominante === 'E' ? 'Esquerdo' : 'Ambidestro'}</span></div>` : ''}
            ${a.data_nascimento ? `<div class="detail-row"><span class="detail-label">Data nascimento</span><span class="detail-value">${new Date(a.data_nascimento).toLocaleDateString('pt-PT')}</span></div>` : ''}
            
            ${historico.length > 1 ? `
              <div style="margin-top:10px">
                <div class="detail-label" style="margin-bottom:4px">Histórico de clubes</div>
                <div class="detail-value" style="text-align:left;font-size:11px">
                  ${historico.map(h => `${h.clube}${h.anos ? ' (' + h.anos + ')' : ''}`).join(' · ')}
                </div>
              </div>
            ` : ''}
            
            ${palmares.length ? `
              <div style="margin-top:10px">
                <div class="detail-label" style="margin-bottom:4px">🏆 Palmarés</div>
                <div class="palmares-list">
                  ${palmares.map(p => `<div class="palmares-item"><strong>${p.titulo}</strong>${p.ano ? ' · ' + p.ano : ''}</div>`).join('')}
                </div>
              </div>
            ` : ''}
            
            ${a.zerozero_url ? `<div style="margin-top:10px"><a href="${a.zerozero_url}" target="_blank" rel="noopener" style="color:var(--gold);text-decoration:none;font-size:11px;font-weight:700">Ver no ZeroZero ↗</a></div>` : ''}
          </div>
        </div>
        <div class="athlete-chev">▶</div>
      </div>
    `;
  }).join('');
  
  list.querySelectorAll('.athlete-card').forEach(card => {
    card.addEventListener('click', () => {
      list.querySelectorAll('.athlete-card.expanded').forEach(c => {
        if (c !== card) c.classList.remove('expanded');
      });
      card.classList.toggle('expanded');
    });
  });
}

document.querySelectorAll('.filter').forEach(f => {
  f.addEventListener('click', () => {
    document.querySelectorAll('.filter').forEach(x => x.classList.remove('active'));
    f.classList.add('active');
    filterEscalao = f.dataset.filter;
    render();
  });
});

document.getElementById('search').addEventListener('input', e => {
  searchTerm = e.target.value;
  render();
});

load();
</script>

</body>
</html>
